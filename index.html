// ====================================================== audio (tiny synth)
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'sine', vol = .15, delay = 0) {
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f0, f1) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = buf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t);
}

// ====================================================== helpers (drawing)
// every "rounded" box in the UI is drawn with chamfered (cut) corners instead — hard-edged, steel-plate look
function rr(x, y, w, h, r) {
  const c = Math.max(1, Math.min(r * .5, w / 2, h / 2, 9));
  ctx.beginPath(); ctx.moveTo(x + c, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c); ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h); ctx.lineTo(x + c, y + h); ctx.lineTo(x, y + h - c); ctx.lineTo(x, y + c); ctx.closePath();
}
function text(s, x, y, size, color, align = 'left', weight = '600', outline) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
// cheap stand-in for a blurred glow around a box (shadowBlur on big panels every frame is expensive): two soft strokes
function halo(x, y, w, h, r, color) {
  ctx.save(); ctx.strokeStyle = color;
  ctx.globalAlpha = .3; ctx.lineWidth = 5; rr(x - 2.5, y - 2.5, w + 5, h + 5, r + 2); ctx.stroke();
  ctx.globalAlpha = .12; ctx.lineWidth = 9; rr(x - 6, y - 6, w + 12, h + 12, r + 5); ctx.stroke();
  ctx.restore();
}
function panel(x, y, w, h, r = 14, border = 'rgba(214,204,150,.30)', bw = 1.5) {
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(38,42,30,.92)'); g.addColorStop(1, 'rgba(16,18,13,.94)');     // dark gunmetal / olive steel
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = border; ctx.lineWidth = bw; ctx.stroke();
  if (w > 120 && h > 34) {   // rivets + inner bevel line
    const sh = ctx.shadowBlur; ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(214,204,150,.32)';
    for (const [px, py] of [[x + 7, y + 7], [x + w - 7, y + 7], [x + 7, y + h - 7], [x + w - 7, y + h - 7]]) { ctx.beginPath(); ctx.arc(px, py, 1.7, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; rr(x + 3.5, y + 3.5, w - 7, h - 7, r - 2); ctx.stroke();
    ctx.shadowBlur = sh;
  }
}
// diagonal yellow/black warning stripes inside a box
function hazard(x, y, w, h, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; rr(x, y, w, h, 4); ctx.clip();
  ctx.fillStyle = '#d4a417'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#17160f';
  for (let sx = x - h; sx < x + w + h; sx += 16) { ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + 8, y + h); ctx.lineTo(sx + 8 + h, y); ctx.lineTo(sx + h, y); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

// ====================================================== scene generation
// ---- maps: the host (or local player) picks one in the armory. Each gen() returns a height function y(x) in world px;
// the result is clamped and then slumped to the sand's angle of repose, so cliffs become steep slopes.
function waveSum(n, amp, freq) {   // a few random sine waves: the basic rolling ground
  const ws = [];
  for (let i = 0; i < n; i++) ws.push({a: rnd(25, 75) * amp * K / (i + 1), f: rnd(0.004, 0.012) * freq * (i + 1) / K, p: rnd(0, TAU)});
  return x => ws.reduce((y, w) => y + Math.sin(x * w.f + w.p) * w.a, 0);
}
const bump = (x, cx, w) => Math.exp(-(((x - cx) / w) ** 2));   // a smooth hill of width w centred on cx
const MAPS = [
  {name: 'ROLLING HILLS', desc: 'Gentle hills. A fair fight.',
   gen: () => { const h = waveSum(4, 1.3, .8); return x => WH * .55 + h(x); }},
  {name: 'MOUNTAIN PASS', desc: 'A huge ridge. Lob it over.',
   gen: () => { const h = waveSum(3, .45, 1), c = WW * rnd(.46, .54), w = WW * rnd(.1, .13);
                return x => WH * .7 + h(x) - 330 * K * bump(x, c, w) - 90 * K * bump(x, c + w * 1.6, w * .6) - 70 * K * bump(x, c - w * 1.7, w * .5); }},
  {name: 'THE GORGE', desc: 'Plateaus over a deep canyon.',

function updateFx() {
  T++;
  for (const p of parts) {
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr;
    if (p.type === 'dirt' && p.y >= ground[clamp(Math.floor(p.x), 0, WW - 1)] && p.vy > 0) p.life = Math.min(p.life, 6);
  }
  parts = parts.filter(p => p.life > 0 && p.y < WH + 40);
  if (parts.length > 1800) parts.splice(0, parts.length - 1800);
  for (const p of uiParts) { p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr; }
  uiParts = uiParts.filter(p => p.life > 0 && p.y < H + 40);
  for (const b of beams) b.t++;
  beams = beams.filter(b => b.t < ORBITAL_DELAY + 40);
  for (const r of rings) r.life--; rings = rings.filter(r => r.life > 0);
  for (const f of flashes) f.life--; flashes = flashes.filter(f => f.life > 0);
  for (const p of popups) { p.y -= .7; p.life--; } popups = popups.filter(p => p.life > 0);
  shake *= .9; if (shake < .15) shake = 0; whiteFlash *= .9;
  const wv = mode === 'menu' ? 3 : wind;
  for (const c of clouds) { c.x += c.v + wv * .03 * (.5 + c.layer * .4); if (c.x > WW + 80) c.x = -680 * K; if (c.x < -680 * K) c.x = WW + 80; }
  updateWeather(); updateSky();

}

// a blast buried in the ground (a drill that ran out of range): the soil it destroys leaves a pocket, and the earth above

function undermine(cx, cy, r) {
  for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(WW - 1, Math.ceil(cx + r)); x++) {
    const dy = Math.sqrt(Math.max(0, r * r - (x - cx) * (x - cx)));
    if (ground[x] < cy - dy) ground[x] = Math.min(WH - 2, ground[x] + 2 * dy);
    else if (ground[x] <= cy + dy) ground[x] = Math.min(WH, cy + dy);
  }

}
function crater(cx, cy, r) {
  for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(WW - 1, Math.ceil(cx + r)); x++) {
    const dx = x - cx, dy = Math.sqrt(r * r - dx * dx);

}
function fire() {

  else { w = WEAPONS[t.weapon]; if (t.ammo[t.weapon] <= 0) return; t.ammo[t.weapon]--; }
  hit = [false, false, false, false];

    shots.push({id: ++shotId, x: m.x, y: m.y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w, owner: turn, trail: [],

const powerMult = t => hasStatus(t, 'shorted') ? STATUS_MULT : 1;

function explode(x, y, w, owner) {
  if (w.kind === 'dirt') {
    for (let px = Math.max(0, Math.floor(x - w.radius)); px <= Math.min(WW - 1, Math.ceil(x + w.radius)); px++) {
      const dy = Math.sqrt(Math.max(0, w.radius * w.radius - (px - x) ** 2));
      if (ground[px] > y - dy) ground[px] = Math.max(60, y - dy);
    }
    terrainDirty = true; disturbSand();
    emit({t: 'dirt', x, y, r: w.radius});
    return;
  }
  if (w.kind === 'teleport') {
    const t = tanks[owner], nx = clamp(x, 16, WW - 16);
    emit({t: 'warp', x: t.x, y: t.y - 8});
    t.x = nx; t.y = ground[Math.floor(nx)] - 4; t.vy = 0; t.tilt = tiltAt(nx);
    emit({t: 'warp', x: t.x, y: t.y - 8});
    emit({t: 'pop', x: t.x, y: t.y - 56, s: 'REDEPLOYED!', c: '#5eead4', z: 22});
    emit({t: 'sfx', n: 'prize'});
    return;
  }
  if (w.kind === 'orbital') {   // targeting beacon landed: the satellite fires after a short charge-up
    const sx = clamp(x, 0, WW - 1);
    strikes.push({x: sx, t: 0, owner, w});
    emit({t: 'orbital', x: sx});
    return;
  }
  const buried = w.kind === 'drill' && y > ground[clamp(Math.floor(x), 0, WW - 1)] + 4;
  if (buried) { undermine(x, y, w.radius); emit({t: 'dirt', x, y: ground[clamp(Math.floor(x), 0, WW - 1)], r: w.radius * .7}); }   // a drill that ran out underground
  else crater(x, y, w.radius);
  terrainDirty = true;
  caveCheck(x, y, w.radius, w.damage);
  emit({t: 'boom', x, y, r: w.radius});
  let dealt = 0;
  for (const t of tanks) {
    const d = tankDist(t, x, y);   // from the blast to the nearest part of the tank: touching it is a full-strength hit
    if (t.hp > 0 && d < w.radius) {
      const dmg = Math.round(w.damage * atkMult(owner) * (hasStatus(t, 'corroded') ? CORRODE_MULT : 1) * (1 - d / w.radius));
      if (dmg <= 0) continue;
      t.hp -= dmg; credit(owner, t, dmg); emit({t: 'pop', x: t.x, y: t.y - 56, s: '-' + dmg, c: '#ff6b5e', z: 22 + dmg / 8});
      if (isEnemy(t, owner)) { hit[owner] = true; dealt += dmg; emit({t: 'sfx', n: 'hit'}); }
      if (w.status && t.hp > 0) {   // status shells: half power on the target's next shot
        t.status = w.status; t.statusLive = false;   // lasts through the victim's next turn
        emit({t: 'pop', x: t.x, y: t.y - 80, s: `${w.status.icon} ${w.status.name}!`, c: w.status.color, z: 19});
      }
    }
  }
  if (w.status) emit({t: 'stfx', k: STATUSES.indexOf(w.status), x, y, r: w.radius});
  if (w.kind === 'vamp' && dealt) {
    const o = tanks[owner]; o.hp = Math.min(o.maxHp, o.hp + dealt);
    emit({t: 'pop', x: o.x, y: o.y - 56, s: '+' + dealt, c: '#a3e635', z: 22});
  }
}

// ---- underground caverns: big hollow pockets under the surface, generated by the host each round. Every blast
// nearby chips at a cave's integrity (closer and bigger blasts do more; cracks spread across the roof). At zero it caves
// in: the ground above drops into the void, tanks on top fall with it, the loose edges slump, and the shock jolts

    sp: .006 + hash01(x * 3 + k) * .01, ph: hash01(x + k * 13) * TAU, col: ['#7ee07a', '#a6e86a', '#b48cf0', '#6fd6c8'][Math.floor(hash01(x * 5 + k) * 4)]}));

    if (caves.some(c => Math.abs(c.x - x) < c.w + w + 60)) continue;
    let surf = 0; for (let px = x - w; px <= x + w; px += 4) surf = Math.max(surf, ground[Math.floor(px)]);
    const top = Math.max(ground[Math.floor(x)] + rnd(55, 100) * K, surf + 30 * K);   // roof thickness below the middle, never poking out on a slope

      ctx.fillStyle = sg; ctx.fillRect(5 - r, off - gn.w * .82, L * .52, gn.w * 1.64);
      ctx.fillStyle = 'rgba(0,0,0,.4)'; ctx.fillRect(5 - r, off - .3, L * .52, .7);
    }
    if (gn.brake) { ctx.fillStyle = '#1d1e19'; ctx.fillRect(L - 5 - r, off - gn.w * .82, 5.5, gn.w * 1.64); ctx.fillStyle = '#4b4e40'; ctx.fillRect(L - 3.5 - r, off - gn.w * .82, 1, gn.w * 1.64); ctx.fillRect(L - 1.5 - r, off - gn.w * .82, 1, gn.w * 1.64); }
  }
  ctx.restore();
  // turret: faceted plates, or a cast dome
  let topY;
  if (M.dome) {
    topY = hullTop - M.dome.ry;
    const dg = ctx.createLinearGradient(0, topY, 0, hullTop); dg.addColorStop(0, light); dg.addColorStop(1, dark);
    ctx.beginPath(); ctx.ellipse(0, hullTop + .5, M.dome.rx, M.dome.ry, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = dg; ctx.fill();
    ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; ctx.stroke();
  } else {
    topY = Math.min(...M.turret.map(p => p[1]));
    const tg = ctx.createLinearGradient(0, topY, 0, hullTop); tg.addColorStop(0, light); tg.addColorStop(1, dark);
    poly(M.turret); ctx.fillStyle = tg; ctx.fill();
    ctx.save(); poly(M.turret); ctx.clip(); ctx.fillStyle = dead ? '#23221e' : dark; ctx.beginPath(); ctx.ellipse(-6, topY + 4, 6, 3, .3, 0, TAU); ctx.fill(); ctx.beginPath(); ctx.ellipse(7, topY + 6.5, 5, 2.4, -.2, 0, TAU); ctx.fill(); ctx.restore();
    poly(M.turret); ctx.strokeStyle = 'rgba(0,0,0,.5)'; ctx.lineWidth = 1; ctx.stroke();
  }
  ctx.fillStyle = '#1d1e19'; ctx.beginPath(); ctx.ellipse(-3.5, topY - .4, 3.4, 1.4, 0, 0, TAU); ctx.fill();   // commander hatch
  ctx.fillStyle = '#2b2d25'; ctx.fillRect(2.5, topY - 3.5, 4.5, 3.4);                                              // sight block
  if (!dead) {
    ctx.fillStyle = '#9ec6a0'; ctx.globalAlpha = .75; ctx.fillRect(5.2, topY - 2.4, 1.6, 1.2); ctx.globalAlpha = 1;
    ctx.strokeStyle = '#1b1c18'; ctx.lineWidth = 1;
    if (M.antennas > 0) { ctx.beginPath(); ctx.moveTo(-9, topY + .5); ctx.lineTo(-13, topY - 15); ctx.stroke(); }   // whip antennas
    if (M.antennas > 1) { ctx.beginPath(); ctx.moveTo(-6, topY + .5); ctx.lineTo(-7, topY - 11); ctx.stroke(); }
    ctx.fillStyle = INK; ctx.globalAlpha = .8; star(-1.5, (topY + hullTop) / 2 + .5, 2.3); ctx.fill(); ctx.globalAlpha = 1;
  }
  ctx.restore();
  if (dead || preview) return;
  // unit tag + armor bar above the tank
  text('0' + (t.i + 1), t.x, t.y - 55, 14, INK, 'center', '800', 'rgba(0,0,0,.75)');
  if (teamMode) { ctx.fillStyle = TEAMS[t.team].color; ctx.beginPath(); ctx.moveTo(t.x - 24, t.y - 60); ctx.lineTo(t.x - 14, t.y - 60); ctx.lineTo(t.x - 19, t.y - 52); ctx.closePath(); ctx.fill(); }   // team chevron
  if (t.status) text(t.status.icon, t.x + 21, t.y - 55, 14, '#fff', 'center');
  rr(t.x - 19, t.y - 49, 38, 6, 2); ctx.fillStyle = 'rgba(0,0,0,.65)'; ctx.fill();
  const hp = clamp(t.shownHp / t.maxHp, 0, 1);
  if (hp > .01) { rr(t.x - 18, t.y - 48, 36 * hp, 4, 1); ctx.fillStyle = hp > .5 ? '#9cc255' : hp > .25 ? '#e0b23c' : '#d6492f'; ctx.fill(); }
  if (active) {
    const b = Math.sin(T * .12) * 3;
    ctx.save(); glow(t.color, 12); ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.moveTo(t.x, t.y - 61 + b); ctx.lineTo(t.x - 8, t.y - 73 + b); ctx.lineTo(t.x + 8, t.y - 73 + b); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawAimHelpers(t) {
  const p = pivot(t), a = t.angle * Math.PI / 180;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, 46, Math.PI, TAU); ctx.stroke();
  for (let d = 0; d <= 180; d += 15) {
    const r = d % 45 === 0 ? 7 : 4, c = Math.cos(d * Math.PI / 180), s = Math.sin(d * Math.PI / 180);
    ctx.beginPath(); ctx.moveTo(p.x + c * 46, p.y - s * 46); ctx.lineTo(p.x + c * (46 + r), p.y - s * (46 + r)); ctx.stroke();
  }
  const len = 34 + t.power * powerMult(t) * .75;
  ctx.setLineDash([6, 6]); ctx.lineDashOffset = -T * .5; ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.globalAlpha = .8;
  ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * 30, p.y - Math.sin(a) * 30); ctx.lineTo(p.x + Math.cos(a) * len, p.y - Math.sin(a) * len); ctx.stroke();
  ctx.restore();
  if (assist && !t.ai && isMine(t)) {
    const pts = previewPoints(t);
    pts.forEach(([x, y], i) => {
      ctx.globalAlpha = 1 - i / pts.length * .85; ctx.fillStyle = '#ffe08a'; ctx.strokeStyle = 'rgba(0,0,0,.6)'; ctx.lineWidth = 1.5;
      ctx.beginPath(); ctx.arc(x, y, 2.6, 0, TAU); ctx.stroke(); ctx.fill();
    });
    ctx.globalAlpha = 1;
  }
}

function drawShots() {
  for (const s of shots) {
    const c = s.w.color || '#fff';
    ctx.lineCap = 'round';
    for (let i = 1; i < s.trail.length; i++) {
      ctx.globalAlpha = i / s.trail.length * .7; ctx.strokeStyle = c; ctx.lineWidth = 1 + i / s.trail.length * 3;
      ctx.beginPath(); ctx.moveTo(s.trail[i - 1][0], s.trail[i - 1][1]); ctx.lineTo(s.trail[i][0], s.trail[i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    const lg = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, 34);   // the shell lights up the air around it
    lg.addColorStop(0, c + '66'); lg.addColorStop(1, c + '00');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = lg; ctx.fillRect(s.x - 34, s.y - 34, 68, 68); ctx.globalCompositeOperation = 'source-over';
    ctx.save(); glow(c, 16); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.w.radius > 50 ? 5 : 3.4, 0, TAU); ctx.fill(); ctx.restore();
  }
}

function drawParts() {
  // drawn in passes by type so the blend mode changes a few times per frame, not once per particle
  ctx.fillStyle = '#5b5d68';
  for (const p of parts) if (p.type === 'smoke') {
    const t = p.life / p.max; ctx.globalAlpha = t * .4;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - t) * 1.8), 0, TAU); ctx.fill();
  }
  for (const p of parts) if (p.type === 'dirt') {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
  }
  ctx.globalCompositeOperation = 'lighter';
  for (const p of parts) if (p.type === 'fire') {
    const t = p.life / p.max; ctx.globalAlpha = Math.min(1, t * 1.4);
    ctx.fillStyle = `hsl(${(12 + t * 42) | 0},100%,${(40 + t * 22) | 0}%)`;
    ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.35 + t), 0, TAU); ctx.fill();
  }
  for (const p of parts) if (p.type === 'spark') {
    ctx.globalAlpha = p.life / p.max; ctx.strokeStyle = p.color || '#ffd27a'; ctx.lineWidth = p.size;
    ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke();
  }
  ctx.globalCompositeOperation = 'source-over';
  ctx.globalAlpha = 1;
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.globalAlpha = t; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * t + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r1, r.r0, t), 0, TAU); ctx.stroke();
  }
  for (const f of flashes) {
    const t = f.life / f.max, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(255,250,220,${t})`); g.addColorStop(.4, `rgba(255,170,60,${t * .55})`); g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.min(1, t * 2.2);
    text(p.s, p.x, p.y, p.size * K * (1 + (1 - t) * .15), p.color, 'center', '900', 'rgba(0,0,0,.75)');
  }
  ctx.globalAlpha = 1;
}

// status effects drawn on the tank: ice crust, fire glow, electric arcs, acid sheen
function drawStatusFx(t) {
  const id = t.status.id;
  ctx.save(); ctx.translate(t.x, t.y + 4);
  if (id === 'burning' || id === 'corroded') {
    const g = ctx.createRadialGradient(0, -14, 2, 0, -14, 34);
    g.addColorStop(0, id === 'burning' ? `rgba(255,120,30,${.32 + Math.sin(T * .3) * .08})` : 'rgba(150,220,60,.30)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(-36, -50, 72, 60); ctx.globalCompositeOperation = 'source-over';
  }
  ctx.rotate(t.tilt);
  if (id === 'frozen') {
    const crust = [[-23, 1], [-24, -12], [-17, -21], [-9, -31], [5, -31], [13, -24], [24, -14], [23, 1]];
    poly(crust); ctx.fillStyle = 'rgba(175,225,255,.38)'; ctx.fill();
    ctx.strokeStyle = 'rgba(235,250,255,.85)'; ctx.lineWidth = 1.2; ctx.stroke();
    ctx.strokeStyle = 'rgba(255,255,255,.45)'; ctx.lineWidth = 1;
    ctx.beginPath(); ctx.moveTo(-15, -6); ctx.lineTo(-6, -24); ctx.moveTo(4, -9); ctx.lineTo(12, -22); ctx.moveTo(-2, -3); ctx.lineTo(9, -14); ctx.stroke();
    ctx.fillStyle = 'rgba(210,240,255,.85)';                    // icicles hanging off the skirt
    for (const ix of [-16, -8, 2, 11, 18]) { ctx.beginPath(); ctx.moveTo(ix - 2, -9.5); ctx.lineTo(ix + 2, -9.5); ctx.lineTo(ix, -4 - (ix % 3 + 3)); ctx.closePath(); ctx.fill(); }
  } else if (id === 'shorted') {
    ctx.strokeStyle = '#d8f6ff'; ctx.lineWidth = 1.6; glow('#9fe8ff', 10);
    for (let k = 0; k < 3; k++) {                                // fresh lightning every frame
      let x = rnd(-18, 18), y = rnd(-28, -6); ctx.beginPath(); ctx.moveTo(x, y);
      for (let s = 0; s < 4; s++) { x += rnd(-9, 9); y += rnd(-7, 7); ctx.lineTo(x, y); }
      ctx.stroke();
    }
    noGlow();
  } else if (id === 'corroded') {
    ctx.fillStyle = 'rgba(140,210,50,.55)';                      // acid drips down the hull
    for (const dx of [-12, -3, 7, 15]) { const len = 4 + (((T * .15 + dx) % 6) + 6) % 6; ctx.fillRect(dx, -13, 1.6, len); }
  }
  ctx.restore();
}

// orbital strike: red targeting laser + shrinking reticle while it charges, then a blinding beam from the top of the sky
function drawBeams() {
  for (const b of beams) {
    const gy = ground[clamp(Math.floor(b.x), 0, WW - 1)];
    if (b.t < ORBITAL_DELAY) {
      const p = b.t / ORBITAL_DELAY, pulse = .45 + .35 * Math.sin(T * .6);
      ctx.save();
      ctx.strokeStyle = `rgba(255,70,50,${pulse})`; ctx.lineWidth = 1.5 + p * 1.5; ctx.setLineDash([10, 6]); ctx.lineDashOffset = -T * 2;
      ctx.beginPath(); ctx.moveTo(b.x, 0); ctx.lineTo(b.x, gy); ctx.stroke(); ctx.setLineDash([]);
      const rr2 = 60 - 40 * p;
      ctx.strokeStyle = `rgba(255,90,60,${.5 + .4 * p})`; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(b.x, gy - 2, rr2, 0, TAU); ctx.stroke();
      for (const a of [0, Math.PI / 2, Math.PI, Math.PI * 1.5]) { ctx.beginPath(); ctx.moveTo(b.x + Math.cos(a) * (rr2 + 4), gy - 2 + Math.sin(a) * (rr2 + 4)); ctx.lineTo(b.x + Math.cos(a) * (rr2 + 14), gy - 2 + Math.sin(a) * (rr2 + 14)); ctx.stroke(); }
      text('ORBITAL STRIKE INBOUND', b.x, gy - rr2 - 26, 13, '#ff8a6a', 'center', '900', 'rgba(0,0,0,.7)');
      ctx.restore();
    } else {
      const k = (b.t - ORBITAL_DELAY) / 26, w = 52 * Math.sin(Math.PI * Math.min(1, k));
      if (w <= 0) continue;
      ctx.save(); ctx.globalCompositeOperation = 'lighter';
      const g = ctx.createLinearGradient(b.x - w, 0, b.x + w, 0);
      g.addColorStop(0, 'rgba(90,200,255,0)'); g.addColorStop(.3, 'rgba(120,220,255,.55)'); g.addColorStop(.5, 'rgba(255,255,255,.95)');
      g.addColorStop(.7, 'rgba(120,220,255,.55)'); g.addColorStop(1, 'rgba(90,200,255,0)');
      ctx.fillStyle = g; ctx.fillRect(b.x - w, 0, w * 2, gy + 8);
      const rg = ctx.createRadialGradient(b.x, gy, 0, b.x, gy, w * 2.4);
      rg.addColorStop(0, 'rgba(200,245,255,.8)'); rg.addColorStop(1, 'rgba(90,200,255,0)');
      ctx.fillStyle = rg; ctx.fillRect(b.x - w * 2.4, gy - w * 2.4, w * 4.8, w * 4.8);
      ctx.restore();
    }
  }
}

function drawWorld(actors) {
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBackdrop(); if (!theme.rain && !theme.dust) drawWindStreaks(); drawTerrain(); drawAliens();
  for (const t of actors) if (t.hp <= 0) drawTank(t, false);
  for (const t of actors) if (t.hp > 0) drawTank(t, mode === 'play' && (state === 'aim' || state === 'move') && t.i === turn);
  for (const t of actors) if (t.hp > 0 && t.status) drawStatusFx(t);
  if (mode === 'play' && state === 'aim' && !paused) drawAimHelpers(tanks[turn]);
  drawSaucers(); drawShots(); if (mode !== 'play') drawMenuShells(); drawParts(); drawBeams(); drawRainAndDust();
  ctx.restore();
  if (boltFlash > .03) { ctx.fillStyle = `rgba(215,228,255,${boltFlash * .3})`; ctx.fillRect(0, 0, WW, WH); }   // lightning lights up the field
  drawGrain();
  if (!vigCanvas) {   // darkened corners + a faint olive grade, like a battlefield camera feed
    vigCanvas = document.createElement('canvas'); vigCanvas.width = WW; vigCanvas.height = WH;
    const v = vigCanvas.getContext('2d'), vg = v.createRadialGradient(WW / 2, WH / 2, WH * .42, WW / 2, WH / 2, WW * .66);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(6,8,4,.5)'); v.fillStyle = vg; v.fillRect(0, 0, WW, WH);
    v.fillStyle = 'rgba(60,70,30,.07)'; v.fillRect(0, 0, WW, WH);
  }
  ctx.drawImage(vigCanvas, 0, 0);
  if (whiteFlash > .02) { ctx.fillStyle = `rgba(255,255,255,${whiteFlash})`; ctx.fillRect(0, 0, WW, WH); }
}

// ====================================================== drawing: HUD
function drawCards() {
  const n = tanks.length, cw = 250, gap = 12, x0 = (W - (cw * n + gap * (n - 1))) / 2, y = 12, h = 62;
  tanks.forEach((t, i) => {
    const x = x0 + i * (cw + gap), act = i === turn && state !== 'over' && state !== 'wheel' || (state === 'wheel' && i === turn);
    ctx.save();
    if (t.hp <= 0) ctx.globalAlpha = .45;
    if (act) halo(x, y, cw, h, 12, t.color);
    panel(x, y, cw, h, 12, act ? t.color : 'rgba(214,204,150,.26)', act ? 2.4 : 1.2);
    if (teamMode) { noGlow(); ctx.fillStyle = TEAMS[t.team].color; ctx.fillRect(x + 10, y + 3, cw - 20, 3); }   // team stripe
    noGlow();
    // unit plate: stencilled number on a team-coloured steel plate
    const pg = ctx.createLinearGradient(0, y + 14, 0, y + 48); pg.addColorStop(0, shade(t.color, .15)); pg.addColorStop(1, shade(t.color, -.35));
    rr(x + 10, y + 14, 34, 34, 8); ctx.fillStyle = pg; ctx.fill(); ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 2; ctx.stroke();
    text(t.hp <= 0 ? '✕' : '0' + (i + 1), x + 27, y + 32, t.hp <= 0 ? 22 : 20, inkOn(t.color), 'center', '900');
    text('UNIT 0' + (i + 1) + ' · ' + TANKS[t.model || 0].name, x + 52, y + 17, 12, INK, 'left', '800');
    const you = net && i === net.seat;
    text(teamMode ? TEAMS[t.team].name + (t.ai ? ' · CPU' : you ? ' · YOU' : '') : (t.ai ? 'CPU' : you ? 'YOU' : 'OPERATOR'), x + cw - 12, y + 17, 11, teamMode ? TEAMS[t.team].color : you ? t.color : INK_DIM, 'right', you ? '900' : '800');
    // armor: segmented bar
    const bx = x + 52, bw = cw - 104, hp = clamp(t.shownHp / t.maxHp, 0, 1), segs = 20, sw = (bw - (segs - 1) * 1.5) / segs, lit = Math.ceil(hp * segs - .001);
    const base = hp > .5 ? '#9cc255' : hp > .25 ? '#e0b23c' : '#d6492f';
    for (let k = 0; k < segs; k++) { ctx.fillStyle = k < lit ? base : 'rgba(255,255,255,.08)'; ctx.fillRect(bx + k * (sw + 1.5), y + 29, sw, 12); }
    text(String(Math.max(0, Math.round(t.hp))), x + cw - 46, y + 33, 13, INK, 'left', '800');
    text('★'.repeat(Math.min(wins[i], 6)) + (wins[i] > 6 ? ' ×' + wins[i] : '') || '', x + 52, y + 51, 12, '#e2b93a', 'left', '700');
    if (!wins[i]) text('NO VICTORIES', x + 52, y + 51, 10, 'rgba(230,224,196,.32)', 'left', '700');
    const ns = t.hp > 0 ? Math.min(3, t.stock.length) : 0, stEnd = ns ? x + cw - 18 - ns * 18 - (t.stock.length > 3 ? 22 : 0) : x + cw - 46;
    if (t.status && t.hp > 0) text(`${t.status.icon} ${t.status.name}`, stEnd, y + 51, 10, t.status.color, 'right', '900');
    if (t.stock.length && t.hp > 0) {   // supply stockpile: the latest few specials, plus a count
      const shown = t.stock.slice(-3), bx0 = x + cw - 14 - shown.length * 18;
      shown.forEach((s, k) => { ctx.fillStyle = s.color + '55'; ctx.beginPath(); ctx.arc(bx0 + k * 18 + 9, y + 50, 8.5, 0, TAU); ctx.fill(); text(s.icon, bx0 + k * 18 + 9, y + 51, 11, '#fff', 'center'); });
      if (t.stock.length > 3) text('+' + (t.stock.length - 3), bx0 - 4, y + 51, 10, INK, 'right', '900');
    }
    ctx.restore();
  });
}

function drawShotClock() {   // online: seconds left for a human's shot
  if (turnLeft <= 0) return;
  const y = 94, h = 24, low = turnLeft <= 10, px = W / 2 - 33;
  panel(px, y - h / 2, 66, h, 12, low ? '#ef4444' : 'rgba(255,255,255,.14)', low ? 2 : 1.5);
  text('⏱ ' + turnLeft, px + 33, y + 1, 13, low ? '#fca5a5' : '#fff', 'center', '800');
}

function drawControlPanel() {
  const t = tanks[turn], x = 90, w = W - 180, y0 = H + 6, h = 84, col = t.color;
  halo(x, y0, w, h, 16, col); panel(x, y0, w, h, 16, col, 2);
  // angle gauge
  const gx = 152, gy = y0 + 70, gr = 52;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.arc(gx, gy, gr - 6, Math.PI, TAU); ctx.stroke();
  const a = t.angle * Math.PI / 180;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.35)';
  for (let d = 0; d <= 180; d += 30) { const c = Math.cos(d * Math.PI / 180), s = Math.sin(d * Math.PI / 180); ctx.beginPath(); ctx.moveTo(gx + c * (gr - 2), gy - s * (gr - 2)); ctx.lineTo(gx + c * (gr + 3), gy - s * (gr + 3)); ctx.stroke(); }
  ctx.save(); glow(col, 8); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(a) * (gr - 4), gy - Math.sin(a) * (gr - 4)); ctx.stroke(); ctx.restore();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(gx, gy, 4, 0, TAU); ctx.fill();
  text(Math.round(t.angle) + '°', gx, gy - 20, 18, INK, 'center', '800');
  text('ANGLE', gx, y0 + 12, 10, 'rgba(255,255,255,.55)', 'center', '800');
  // power
  const px = 240, pw = 284, st = t.status, eff = shotPower(t), dial = Math.round(t.power);
  if (st && st.id === 'shorted') {   // EMP: this shot fires at half power — show the dial value AND what actually comes out
    text(`POWER ×½ — ${st.icon} ${st.name}`, px, y0 + 16, 11, st.color, 'left', '900');
    text(`${dial} → ${Math.round(eff)}`, px + pw, y0 + 16, 18, st.color, 'right', '800');
  } else {
    text(st ? `POWER — ${st.icon} ${st.name}: ${st.short}` : 'POWER', px, y0 + 16, 11, st ? st.color : INK_DIM, 'left', st ? '900' : '800');
    text(String(dial), px + pw, y0 + 16, 18, INK, 'right', '800');
  }
  // 20 segments of exactly 5 power each; the last one fills part-way, so the bar always matches the number
  const segs = 20, sw = (pw - (segs - 1) * 2) / segs;
  for (let i = 0; i < segs; i++) {

function drawWheel() {
  const n = SPECIALS.length, step = TAU / n, cx = W / 2, cy = H / 2 + 14, r = 168;
  const R = wheelAngle(wheel.t), t = tanks[turn], done = wheel.t >= wheel.spin;
  ctx.fillStyle = 'rgba(8,10,5,.93)'; ctx.fillRect(0, 0, W, H);
  // rotating rays
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(T * .004);
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 720, 0, TAU / 36); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  text(`SUPPLY DROP — UNIT 0${turn + 1}`, cx, 52, 34, t.color, 'center', '900', 'rgba(0,0,0,.6)');
  text(done ? 'SUPPLY DROP AUTHORIZED' : 'REQUISITIONING SUPPLIES…', cx, 88, 15, 'rgba(255,255,255,.7)', 'center', '800');
  // outer ring
  ctx.save(); glow(done ? SPECIALS[wheel.idx].color : '#facc15', 26);
  ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, TAU); ctx.fillStyle = '#1d2016'; ctx.fill(); noGlow();
  ctx.strokeStyle = '#d4a417'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
  for (let i = 0; i < 28; i++) {
    const a = i / 28 * TAU, on = done ? (Math.floor(T / 6) % 2 === i % 2) : ((i + Math.floor(T / 3)) % 3 === 0);
    ctx.fillStyle = on ? '#fff7b0' : '#8a7a2a'; if (on) glow('#ffe66d', 10);
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (r + 11), cy + Math.sin(a) * (r + 11), 4, 0, TAU); ctx.fill(); noGlow();
  }
  // slices
  for (let i = 0; i < n; i++) {
    const a0 = R + i * step - Math.PI / 2, sp = SPECIALS[i], win = done && i === wheel.idx;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
    g.addColorStop(0, shade(sp.color, .08)); g.addColorStop(1, shade(sp.color, -.42));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a0 + step); ctx.closePath(); ctx.fill();
    if (win && Math.floor(T / 8) % 2) { ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 1.6; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + step / 2);
    text(sp.short || sp.name, r - 12, 0, 12.5, '#fff', 'right', '900', 'rgba(0,0,0,.5)');
    ctx.save(); ctx.translate(r - 104, 0); ctx.rotate(Math.PI / 2); text(sp.icon, 0, 0, 21, '#fff', 'center'); ctx.restore();
    ctx.restore();

  ctx.strokeStyle = '#d4a417'; ctx.lineWidth = 3; ctx.stroke();

    text(sp.name, -178, -10, 24, '#fff', 'left', '900');

// title: stencil lettering (gaps cut through the round letters) rendered once to an offscreen canvas
let titleCanvas = null, titleWidth = 0;
function renderTitle() {
  const w = 900, h = 120, c = document.createElement('canvas'); c.width = w * S; c.height = h * S;
  const g = c.getContext('2d'); g.scale(S, S);
  try { g.letterSpacing = '9px'; } catch (e) {}
  g.font = `900 76px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
  titleWidth = g.measureText(GAME_NAME).width;
  // war-poster lettering: cream paint with a hard blood-red block shadow and a dark keyline, worn and chipped
  const x0 = (w - titleWidth) / 2, tg = g.createLinearGradient(0, 26, 0, 94);
  tg.addColorStop(0, '#f3e8c6'); tg.addColorStop(1, '#d9c592');
  g.lineJoin = 'miter';
  for (let d = 7; d >= 1; d--) { g.fillStyle = d > 1 ? '#7d2116' : '#a3271c'; g.fillText(GAME_NAME, x0 + d, h / 2 + d); }   // extruded red block shadow
  g.lineWidth = 3; g.strokeStyle = '#1d150b'; g.strokeText(GAME_NAME, x0, h / 2);
  g.fillStyle = tg; g.fillText(GAME_NAME, x0, h / 2);
  g.globalCompositeOperation = 'destination-out';
  for (let i = 0; i < 260; i++) {   // chipped paint
    g.fillStyle = `rgba(0,0,0,${rnd(.3, .9)})`; g.beginPath(); g.ellipse(x0 + Math.random() * (titleWidth + 8), 18 + Math.random() * 84, rnd(.4, 1.8), rnd(.3, 1.2), rnd(0, 3), 0, TAU); g.fill();
  }
  g.globalCompositeOperation = 'destination-out';   // stencil bridges through letters with enclosed shapes
  for (let i = 0; i < GAME_NAME.length; i++) {
    if (!'ABDOPQRCGU0'.includes(GAME_NAME[i])) continue;
    const cx = x0 + g.measureText(GAME_NAME.slice(0, i)).width + (g.measureText(GAME_NAME[i]).width - 9) / 2;
    g.fillRect(cx - 1.6, 14, 3.2, h - 28);
  }
  const c2 = document.createElement('canvas'); c2.width = c.width; c2.height = c.height;   // bake the drop shadow in once
  const g2 = c2.getContext('2d'); g2.shadowColor = 'rgba(0,0,0,.75)'; g2.shadowBlur = 16 * S; g2.drawImage(c, 0, 0);
  titleCanvas = c2;
}

    const online = menuStage === 'hostcount';
    text(online ? 'HOW MANY TANKS IN THE ROOM?  (friends take the open seats, CPUs fill the rest)' : 'SELECT FORCE SIZE', W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    [2, 3, 4].forEach((n, i) => { if (button(W / 2 - 300 + i * 205, 218, 190, 96, n + '', n + ' TANKS', n, COLORS[i + 1], () => online ? (sfx.click(), hostRoom(n)) : pickCount(n))) any = true; });
    if (netMsg) text(netMsg, W / 2, 384, 14, '#fca5a5', 'center', '800', 'rgba(0,0,0,.6)');
  } else {
    text(`${numPlayers} TANKS — HOW MANY HUMANS?`, W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    const opts = Array.from({length: numPlayers + 1}, (_, i) => i), bw = 150, gap = 14, x0 = W / 2 - (opts.length * bw + (opts.length - 1) * gap) / 2;
    opts.forEach((n, i) => {
      const sub = n === 0 ? 'WATCH CPUs' : n === numPlayers ? 'ALL HUMAN' : (numPlayers - n) + ' CPU';
      if (button(x0 + i * (bw + gap), 218, bw, 96, n + '', sub, n, COLORS[i % 4], () => pickHumans(n))) any = true;
    });
  }
  cv.style.cursor = any || backHov ? 'pointer' : 'default';

  // the briefing documents: a typed field manual and the supply manifest, taped down on the table
  paper(60, 392, 470, 204, 3);
  tape(110, 394, 70, -.12); tape(480, 394, 70, .1);
  text('FIELD MANUAL  FM 17-IR', 84, 420, 16, PAPER_INK, 'left', '900');
  ttext('OPERATION OF THE MEDIUM TANK', 84, 438, 10, 'rgba(43,35,22,.7)');
  ctx.fillStyle = 'rgba(43,35,22,.5)'; ctx.fillRect(84, 448, 420, 1.2);
  [['←  →', 'aim the barrel'], ['↑  ↓', 'set power (Shift = fine)'], ['A  D', 'drive (limited fuel)'], ['1 – 4', 'pick weapon'], ['SPACE', 'FIRE!'], ['T / M / P', 'aim assist / sound / pause']]
    .forEach(([k, d], i) => { const y = 466 + i * 21; ctx.strokeStyle = 'rgba(43,35,22,.55)'; ctx.lineWidth = 1.2; rr(84, y - 9, 86, 18, 4); ctx.stroke();
                              text(k, 127, y + 1, 12, PAPER_INK, 'center', '900'); ttext(d, 184, y + 1, 12.5); });
  stamp('RESTRICTED', 452, 560, 14, -.2);
  paper(550, 392, 510, 204, 5);
  tape(600, 394, 70, .08); tape(1010, 394, 70, -.1);
  text('SUPPLY MANIFEST', 574, 420, 16, PAPER_INK, 'left', '900');
  ttext('HIT AN ENEMY > KEY THE AUTH CODE > SUPPLY DROP', 574, 438, 10, 'rgba(43,35,22,.7)');
  ctx.fillStyle = 'rgba(43,35,22,.5)'; ctx.fillRect(574, 448, 462, 1.2);
  SPECIALS.forEach((s, i) => {   // 12 prizes in a 3 x 4 grid, typed up as inventory lines
    const x = 570 + (i % 3) * 160, y = 470 + Math.floor(i / 3) * 33;
    ctx.fillStyle = s.color; ctx.fillRect(x, y - 13, 4, 26);
    text(s.icon, x + 18, y + 1, 15, '#000', 'center'); text(s.name.toUpperCase(), x + 32, y - 6, 11.5, PAPER_INK, 'left', '900'); ttext(s.tag, x + 32, y + 8, 9.5, 'rgba(43,35,22,.75)');
  });
  drawUIParts();
}

// ====================================================== main draw/loop
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);              // world space (1680 x 945, top of the canvas)
  drawWorld(mode === 'play' ? tanks : menuTanks);
  if (mode !== 'play') drawNewsreel();
  ctx.setTransform(S, 0, 0, S, 0, 0);             // interface space (1120 x 782) from here on
  drawStrip();
  if (mode === 'menu' || mode === 'armory') {
    mode === 'menu' ? drawMenu() : drawArmory();
    text(GAME_NAME + '  ·  ARMORED ARTILLERY  ·  click an ammo type below to see what it does', W / 2, H + 50, 14, INK_DIM, 'center', '800');
    drawInfoCard();
  } else {
    uiButtons = [];
    drawOffscreenShells();
    drawCards(); drawShotClock(); drawControlPanel(); drawInfoCard(); drawBanner();
    if (state === 'quick' && qte) drawQuick();
    if (state === 'wheel' && wheel) drawWheel();
    if (state === 'over') drawOver();
    if (paused) {
      ctx.fillStyle = 'rgba(8,10,5,.62)'; ctx.fillRect(0, 0, W, H);
      text('PAUSED', W / 2, H / 2 - 10, 60, '#fff', 'center', '900', 'rgba(0,0,0,.6)');
      text('press P to resume', W / 2, H / 2 + 40, 16, 'rgba(255,255,255,.7)', 'center', '700');
    }
    drawUIParts();
    cv.style.cursor = 'default';
  }
  if (infoPopup) drawInfoPopup();
  if (infoButtons.some(b => inRect(mouse, b)) || infoPopup) cv.style.cursor = 'pointer';
}

function drawUIParts() {   // confetti, in interface space
  for (const p of uiParts) {
    ctx.globalAlpha = Math.min(1, p.life / p.max * 2); ctx.fillStyle = p.color;
    ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.7)) + .2);
    ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
  }
  ctx.globalAlpha = 1;
}

// shells that fly above the top of the screen: a marker at the top edge with their altitude
function drawOffscreenShells() {
  for (const s of shots) {
    if (s.y > -12) continue;
    const ux = clamp(s.x / S, 10, W - 10), uy = 116, alt = Math.round(-s.y / 10);
    ctx.fillStyle = s.w.color || INK;
    ctx.beginPath(); ctx.moveTo(ux, uy - 8); ctx.lineTo(ux - 6, uy + 2); ctx.lineTo(ux + 6, uy + 2); ctx.closePath(); ctx.fill();
    text('▲ ' + alt + 'm', ux, uy + 12, 10, INK, 'center', '800', 'rgba(0,0,0,.7)');
  }
}

function initMenuScene() {
  numPlayers = 4; makeScene(null, null, Math.floor(Math.random() * MAPS.length)); menuShells = []; nextMenuShot = 60;
  menuTanks = [0, 1, 2, 3].map(i => { const t = newTank(i); t.model = Math.floor(Math.random() * TANKS.length); t.x = (130 + i * 285 + rnd(-30, 30)) * S; t.y = ground[Math.floor(t.x)] - 4; t.tilt = tiltAt(t.x); return t; });
  numPlayers = 2;
}

// ====================================================== input
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true; audio();
  if (infoPopup && (k === 'escape' || k === 'enter' || k === ' ')) { infoPopup = null; e.preventDefault(); return; }   // close the ammo popup
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'backspace'].includes(k)) e.preventDefault();
  if (mode === 'menu' && menuStage === 'join') {            // typing a room code
    if (k === 'escape') { menuStage = 'home'; netMsg = ''; }
    else if (k === 'enter') joinRoom(codeInput);
    else if (k === 'backspace') codeInput = codeInput.slice(0, -1);
    else if (/^[a-z0-9]$/.test(k) && !e.ctrlKey && !e.metaKey && codeInput.length < 5) codeInput += k.toUpperCase();
    return;
  }
  if (k === 'm') { muted = !muted; return; }
  if (mode === 'armory') {
    if (k === 'escape') { if (net) leaveRoom(); else if (campaign) leaveMission(false); else { mode = 'menu'; menuStage = 'humans'; loadout = null; } return; }
    if (campaign && k.length === 1 && 'gnct'.includes(k)) return;   // a mission fixes the map, sides and CPUs
    if (k === 'tab' && !net) {   // hot-seat: move the keyboard to the next human player's panel
      e.preventDefault();
      const hum = loadout.map((p, j) => p.cpu ? -1 : j).filter(j => j >= 0);
      armoryFocus = hum[(hum.indexOf(armoryFocus) + 1) % hum.length]; return;
    }
    if (k === 'g' && loadout.length >= 3) { setTeamMode(!teamMode); return; }   // game mode (local player / host)
    if (k === 'n') { setMap(mapIdx + (e.shiftKey ? -1 : 1)); return; }           // map (local player / host)
    if (k === 'c') { setCpuLevel(cpuLevel + (e.shiftKey ? -1 : 1)); return; }   // CPU difficulty (local player / host)
    const i = net ? net.seat : armoryFocus;
    if (!canEditSeat(i)) return;
    const p = loadout[i];
    if (k === 't' && teamMode) { requestPick(i, {team: 1 - (p.team || 0)}); return; }
    if (k === 'arrowleft') requestPick(i, {model: p.model - 1});
    else if (k === 'arrowright') requestPick(i, {model: p.model + 1});
    else if (k === 'arrowup') requestPick(i, {color: cycleColor(i, -1)});
    else if (k === 'arrowdown') requestPick(i, {color: cycleColor(i, 1)});
    else if ((k === 'enter' || k === ' ') && !e.repeat) {
      requestPick(i, {ready: !p.ready});
      if (!net && loadout[i].ready) { const nx = loadout.findIndex(q => !q.cpu && !q.ready); if (nx >= 0) armoryFocus = nx; }   // hand the keys to the next player
    }
    return;
  }
  if (mode === 'menu') {
    const n = parseInt(e.key);
    if (k === 'escape' || k === 'backspace') {
      if (menuStage === 'lobby' || menuStage === 'connecting') leaveRoom();
      else menuStage = menuStage === 'humans' ? 'count' : 'home';
      netMsg = ''; return;
    }
    if (menuStage === 'home') { if (n === 1) { const cp = campProgress(); campSel = Math.min(cp.unlocked, MISSIONS.length) - 1; menuStage = 'campaign'; } else if (n === 2) menuStage = 'count'; else if (n === 3) menuStage = 'hostcount'; else if (n === 4) { codeInput = ''; netMsg = ''; menuStage = 'join'; } }
    else if (menuStage === 'campaign') {   // the mission board
      if (k === 'arrowup' || k === 'arrowdown') { campSel = clamp(campSel + (k === 'arrowdown' ? 1 : -1), 0, MISSIONS.length - 1); sfx.click(); }
      else if (k === 'enter' && campSel < campProgress().unlocked) startMission(campSel);
    }
    else if (menuStage === 'count') { if (n >= 2 && n <= 4) pickCount(n); }
    else if (menuStage === 'hostcount') { if (n >= 2 && n <= 4) hostRoom(n); }
    else if (menuStage === 'humans') { if (n >= 0 && n <= numPlayers) pickHumans(n); }
    else if (menuStage === 'lobby' && k === 'enter') startOnline();
    return;
  }
  if (k === 'escape') { if (net) leaveRoom(); else if (campaign) leaveMission(false); else { mode = 'menu'; menuStage = 'home'; loadout = null; initMenuScene(); } return; }
  if (campaign && state === 'over') {   // won: ENTER back to the board (next mission picked) · lost: ENTER retries · R replays either way
    if (k === 'enter') { if (campResult && campResult.won) leaveMission(true); else startRound(); return; }
    if (k === 'r') { startRound(); return; }
  }
  if (k === 'p' && state !== 'over' && !net) { paused = !paused; return; }
  if (k === 't') { assist = !assist; return; }
  if (state === 'over' && k === 'enter' && (!net || net.role === 'host')) { startRound(); return; }
  if (paused || !tanks.length) return;
  const t = tanks[turn];
  if (state === 'quick' && qte && !qte.done) {               // the post-hit W/A/S/D combo
    if ('wasd'.includes(k) && k.length === 1 && !e.repeat && !t.ai && isMine(t)) pressCombo(k);
    return;
  }
  if (state === 'move' && !t.ai && isMine(t) && (k === 'enter' || k === 'e') && !e.repeat) { requestEndMove(); return; }
  if (state === 'aim' && !t.ai && isMine(t)) {
    if (k === ' ' && !e.repeat) tryFire();
    const n = '1234'.indexOf(k);
    if (n >= 0 && k.length === 1 && t.ammo[n] > 0) { t.weapon = n; t.armed = -1; sfx.click(); }
    if (k === 'q' && !e.repeat) cycleSupply(t);   // arm the next special in the stockpile
  }
});
addEventListener('paste', e => {
  if (mode !== 'menu' || menuStage !== 'join') return;
  const s = (e.clipboardData && e.clipboardData.getData('text')) || '';
  const m = s.match(/room=([A-Za-z0-9]{4,6})/) || s.match(/^\s*([A-Za-z0-9]{4,6})\s*$/);
  if (m) codeInput = m[1].toUpperCase().slice(0, 5);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function toCanvas(e) { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * UH / r.height}; }
const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const activePtr = new Map();   // pointer currently dragging a control (power bar / angle dial)
cv.addEventListener('pointerdown', e => {
  audio(); Object.assign(mouse, toCanvas(e));
  if (infoPopup) { infoPopup = null; return; }                                   // any click closes the ammo popup
  for (const b of infoButtons) if (inRect(mouse, b)) { b.action(); return; }   // ammo chips on the info card
  if (mode === 'menu' || mode === 'armory') {
    for (const b of menuButtons) if (inRect(mouse, b)) { b.action(); break; }
    return;
  }
  for (const b of uiButtons) if (inRect(mouse, b)) {      // mouse shortcuts on the control panel
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    if (b.drag) { activePtr.set(e.pointerId, b); b.drag(mouse.x, mouse.y); }
    else if (b.tap) b.tap();
    break;
  }
});
cv.addEventListener('pointermove', e => { Object.assign(mouse, toCanvas(e)); const b = activePtr.get(e.pointerId); if (b && b.drag) b.drag(mouse.x, mouse.y); });
const ptrUp = e => activePtr.delete(e.pointerId);
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1; });

initMenuScene();

// Fixed 60 Hz simulation, driven by a Web Worker timer so the host keeps running even when its tab is in the
// background (browsers throttle normal timers/rAF in hidden tabs, which would freeze everyone else's game).
let lastTick = performance.now(), acc = 0;
function tick() {
  const now = performance.now(); acc += Math.min(250, now - lastTick); lastTick = now;
  netTick();
  for (let n = 0; acc >= 1000 / 60 && n < 8; n++, acc -= 1000 / 60) update();
}
try {
  const wk = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),8)'], {type: 'text/javascript'})));
  wk.onmessage = tick;
} catch (e) { setInterval(tick, 8); }
(function frame() { draw(); requestAnimationFrame(frame); })();

// invite links look like  .../?room=ABCDE
(function () {
  const m = location.search.match(/[?&]room=([A-Za-z0-9]{4,6})/);
  if (m) { codeInput = m[1].toUpperCase().slice(0, 5); setTimeout(() => joinRoom(codeInput), 400); }
})();
</script>
