<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorched Tanks</title>
<style>
  html,body{margin:0;height:100%;background:#07080d;overflow:hidden;overscroll-behavior:none}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh * 1120 / 630));aspect-ratio:1120/630;display:block;box-shadow:0 0 60px #000;user-select:none}
</style>
</head>
<body>
<canvas id="c" width="1120" height="630"></canvas>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;
const G = 0.12, POWER_SCALE = 0.1, WIND_SCALE = 0.004;
const GROUND_MIN = 200, GROUND_MAX = H - 160;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ====================================================== data
const WEAPONS = [
  {name:'Missile',  icon:'🚀', color:'#ffd966', radius:32, damage:45, shots:1, ammo:Infinity},
  {name:'Big Bomb', icon:'💣', color:'#ff8a5c', radius:60, damage:75, shots:1, ammo:3},
  {name:'Triple',   icon:'☄️', color:'#8be9fd', radius:24, damage:35, shots:3, ammo:3},
];
// Prize-wheel specials: one use, applied to the winner's next attack
const SPECIALS = [
  {name:'NUKE',      icon:'☢️', color:'#ef4444', desc:'Massive blast',          radius:115, damage:100, shots:1, kind:'nuke'},
  {name:'MIRV',      icon:'🎆', color:'#f59e0b', desc:'Splits into 5 warheads', radius:30,  damage:40,  shots:1, kind:'mirv'},
  {name:'DIRT BOMB', icon:'🪨', color:'#b4733a', desc:'Buries with dirt',       radius:55,  damage:0,   shots:1, kind:'dirt'},
  {name:'BOUNCER',   icon:'🏀', color:'#22c55e', desc:'Bounces 3 times',        radius:35,  damage:45,  shots:1, kind:'bounce'},
  {name:'AIRSTRIKE', icon:'✈️', color:'#3b82f6', desc:'6 bombs rain down',      radius:30,  damage:40,  shots:1, kind:'air'},
  {name:'TELEPORT',  icon:'🌀', color:'#14b8a6', desc:'Warps you to where it lands', radius:0, damage:0, shots:1, kind:'teleport'},
  {name:'VAMPIRE',   icon:'🧛', color:'#a855f7', desc:'Heals you by damage dealt', radius:40, damage:55, shots:1, kind:'vamp'},
];
const CHILD = {name:'Child', color:'#ffd0a0', radius:26, damage:35, shots:1, kind:'child'};
// squad colors: olive drab, desert tan, steel blue, brick red — muted but still easy to tell apart
const COLORS = ['#86a64a', '#d4a95c', '#6f93b3', '#c0583d'];
const ALLW = [...WEAPONS, ...SPECIALS, CHILD];   // index = id used on the wire
const FONT = '"Bahnschrift SemiBold Condensed","Bahnschrift","Agency FB","Arial Narrow","Segoe UI",sans-serif';
const INK = '#e6e0c4', INK_DIM = 'rgba(230,224,196,.62)';   // khaki "stencil paint" text on dark steel

// war-torn battlefields: overcast, smoky dusk, night (green-tinted), arid. haze = smoke/fog colour, ruin = silhouette colour
const THEMES = [
  {name:'Overcast', sky:['#6d7a80', '#98a5a6', '#c3c6b8'], sun:{x:.76, y:.2, r:26, c:'#eef0dd', glow:'rgba(240,240,220,.55)'}, stars:0,
   cloud:'#aeb4b0', haze:'90,92,84', ruin:'#3d4640', mtn:['#7b8780', '#5c6a62'], top:'#566337', grass:'#7d8c49', dirt:['#6e5a3a', '#4a3b25', '#2a2114']},
  {name:'Dusk', sky:['#2b2a33', '#7a4a3a', '#d9894a'], sun:{x:.24, y:.52, r:40, c:'#ffd9a0', glow:'rgba(255,150,70,.8)'}, stars:30,
   cloud:'#8f5b48', haze:'70,48,40', ruin:'#241c1a', mtn:['#5b3b36', '#3a2624'], top:'#5d6234', grass:'#8b8f4c', dirt:['#6a4a30', '#46301f', '#241810']},
  {name:'Night', sky:['#05090a', '#0c1a16', '#1e3a30'], sun:{x:.8, y:.2, r:24, c:'#dbe8d4', glow:'rgba(150,210,170,.45)'}, stars:120, moon:true,
   cloud:'#27403a', haze:'30,56,48', ruin:'#050a08', mtn:['#14261f', '#0a1511'], top:'#2f5a3a', grass:'#4f9a5e', dirt:['#3f4a35', '#2a3223', '#141a10']},
  {name:'Arid', sky:['#a6866a', '#d1b385', '#ecd9ac'], sun:{x:.7, y:.26, r:32, c:'#fff3cf', glow:'rgba(255,235,170,.75)'}, stars:0,
   cloud:'#d9c8a2', haze:'176,150,110', ruin:'#6e5a43', mtn:['#b89a74', '#8f7552'], top:'#a2874a', grass:'#c6aa66', dirt:['#a98558', '#7a5c38', '#45331d']},
];

// ====================================================== state
let ground, tanks = [], shots = [], parts = [], rings = [], flashes = [], popups = [], scorches = [];
let pending = [], hit = [false, false, false, false];
let wind = 0, turn = 0, state = 'aim', wins = [0, 0, 0, 0], winner = -1;
let theme = THEMES[0], bgCanvas, texCanvas, vigCanvas, clouds = [], stars = [], streaks = [], menuTanks = [];
let numPlayers = 2, numHumans = 1, menuStage = 'home';
let mode = 'menu', paused = false, assist = true, muted = false;
const TURN_SECONDS = 45, QTE_FRAMES = 60;   // 1-second key combo after a hit
let qte = null;
const shuffled = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
let turnFrames = 0, turnLeft = 0;
let net = null, netMsg = '', codeInput = '', evq = [], terrainDirty = false, themeIdx = 0, shotId = 0, copiedAt = -999;
let shake = 0, whiteFlash = 0, T = 0, aiTimer = 0, aiPlan = null;
let banner = null, wheel = null, menuButtons = [], uiButtons = [];
const keys = {}, mouse = {x: -1, y: -1};

// ====================================================== audio (tiny synth)
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'sine', vol = .15, delay = 0) {
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f0, f1) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = buf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  fire:   () => { noise(.25, .3, 2500, 300); tone(160, 45, .25, 'triangle', .25); },
  boom:   r => { noise(.5 + r / 120, .55, 1800, 80); tone(90, 30, .5 + r / 150, 'sine', .45); },
  tick:   () => tone(900, 700, .04, 'square', .05),
  hit:    () => { tone(660, 990, .12, 'triangle', .12); },
  win:    () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .16, i * .1)),
  prize:  () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, .3, 'square', .08, i * .08)),
  click:  () => tone(500, 650, .06, 'square', .06),
  fail:   () => { tone(220, 70, .35, 'sawtooth', .12); },
};

// ====================================================== helpers (drawing)
// every "rounded" box in the UI is drawn with chamfered (cut) corners instead — hard-edged, steel-plate look
function rr(x, y, w, h, r) {
  const c = Math.max(1, Math.min(r * .5, w / 2, h / 2, 9));
  ctx.beginPath(); ctx.moveTo(x + c, y); ctx.lineTo(x + w - c, y); ctx.lineTo(x + w, y + c); ctx.lineTo(x + w, y + h - c);
  ctx.lineTo(x + w - c, y + h); ctx.lineTo(x + c, y + h); ctx.lineTo(x, y + h - c); ctx.lineTo(x, y + c); ctx.closePath();
}
function text(s, x, y, size, color, align = 'left', weight = '600', outline) {
  ctx.font = `${weight} ${size}px ${FONT}`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
function panel(x, y, w, h, r = 14, border = 'rgba(214,204,150,.30)', bw = 1.5) {
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(38,42,30,.92)'); g.addColorStop(1, 'rgba(16,18,13,.94)');     // dark gunmetal / olive steel
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = border; ctx.lineWidth = bw; ctx.stroke();
  if (w > 120 && h > 34) {   // rivets + inner bevel line
    const sh = ctx.shadowBlur; ctx.shadowBlur = 0;
    ctx.fillStyle = 'rgba(214,204,150,.32)';
    for (const [px, py] of [[x + 7, y + 7], [x + w - 7, y + 7], [x + 7, y + h - 7], [x + w - 7, y + h - 7]]) { ctx.beginPath(); ctx.arc(px, py, 1.7, 0, TAU); ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.06)'; ctx.lineWidth = 1; rr(x + 3.5, y + 3.5, w - 7, h - 7, r - 2); ctx.stroke();
    ctx.shadowBlur = sh;
  }
}
// diagonal yellow/black warning stripes inside a box
function hazard(x, y, w, h, alpha = 1) {
  ctx.save(); ctx.globalAlpha = alpha; rr(x, y, w, h, 4); ctx.clip();
  ctx.fillStyle = '#d4a417'; ctx.fillRect(x, y, w, h); ctx.fillStyle = '#17160f';
  for (let sx = x - h; sx < x + w + h; sx += 16) { ctx.beginPath(); ctx.moveTo(sx, y + h); ctx.lineTo(sx + 8, y + h); ctx.lineTo(sx + 8 + h, y); ctx.lineTo(sx + h, y); ctx.closePath(); ctx.fill(); }
  ctx.restore();
}

// ====================================================== scene generation
function makeTerrain() {
  ground = new Float32Array(W);
  const waves = [];
  for (let i = 0; i < 4; i++) waves.push({a: rnd(25, 75) / (i + 1), f: rnd(0.004, 0.012) * (i + 1), p: rnd(0, TAU)});
  for (let x = 0; x < W; x++) {
    let y = H * 0.55;
    for (const w of waves) y += Math.sin(x * w.f + w.p) * w.a;
    ground[x] = clamp(y, GROUND_MIN, GROUND_MAX);
  }
  for (let i = 0; i < 4000 && sandStep(false) > 0.005; i++);   // start in equilibrium so only disturbed sand moves
}

// ---- sand: the ground is loose granular material. Wherever two neighbouring columns differ by more than the angle of
// repose, the higher one sheds sand onto the lower one (volume is conserved), so craters cave in and piles spread out.
const REPOSE = 0.72;                      // max height step between neighbouring pixel columns (~36 degrees, like dry sand)
let sandActive = false, sandQuiet = 0, sandFrames = 0;
function sandStep(fx = true) {
  let moved = 0;
  const fwd = (T & 1) === 0;              // alternate sweep direction so slides don't lean one way
  for (let k = 0; k < W - 1; k++) {
    const x = fwd ? k : W - 2 - k, d = ground[x + 1] - ground[x], ex = Math.abs(d) - REPOSE;
    if (ex > 0.02) {
      const m = Math.min(ex * 0.45, 2.4), hi = d > 0 ? x : x + 1, lo = d > 0 ? x + 1 : x;   // y grows downward: the smaller y is the higher sand
      ground[hi] = Math.min(H, ground[hi] + m); ground[lo] -= m; moved += m;
      if (fx && m > .8 && Math.random() < .12) dust(hi, ground[hi]);
    }
  }
  return moved;
}
function dust(x, y) {
  addP({type: 'dirt', x, y: y - 2, vx: rnd(-.6, .6), vy: -rnd(.2, 1.1), g: .05, life: rnd(18, 36), size: rnd(1.5, 3), color: theme.dirt[0]});
}
function disturbSand() { sandActive = true; sandQuiet = 0; sandFrames = 0; }

function renderBG() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sk = g.createLinearGradient(0, 0, 0, H * .85);
  theme.sky.forEach((col, i) => sk.addColorStop(i / (theme.sky.length - 1), col));
  g.fillStyle = sk; g.fillRect(0, 0, W, H);
  const s = theme.sun, sx = s.x * W, sy = s.y * H;
  const gl = g.createRadialGradient(sx, sy, 0, sx, sy, s.r * 6);
  gl.addColorStop(0, s.glow); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  g.fillStyle = s.c; g.beginPath(); g.arc(sx, sy, s.r, 0, TAU); g.fill();
  if (theme.moon) { g.fillStyle = 'rgba(120,130,170,.35)'; for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(sx + rnd(-s.r * .6, s.r * .6), sy + rnd(-s.r * .6, s.r * .6), rnd(2, 6), 0, TAU); g.fill(); } }
  theme.mtn.forEach((col, li) => {
    const base = H * (.56 + li * .07), amp = 130 - li * 30, p1 = rnd(0, 9), p2 = rnd(0, 9);
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, base - amp * (Math.abs(Math.sin(x * .005 * (li + 1) + p1)) * .7 + Math.abs(Math.sin(x * .014 + p2)) * .3));
    g.lineTo(W, H); g.fill();
  });
  // distant war-torn skyline: shelled buildings, dead trees, utility poles, burning wrecks with smoke columns
  const base = H * .6;
  g.fillStyle = theme.ruin; g.strokeStyle = theme.ruin;
  const fires = [];
  for (let x = rnd(0, 50); x < W;) {
    const kind = Math.random();
    if (kind < .42) {                                   // ruined building
      const bw = rnd(28, 64), bh = rnd(34, 92);
      g.beginPath(); g.moveTo(x, base + 30); g.lineTo(x, base - bh * rnd(.5, 1));
      for (let k = 1; k <= 5; k++) g.lineTo(x + bw * k / 5, base - bh * rnd(.55, 1.05));
      g.lineTo(x + bw, base + 30); g.closePath(); g.fill();
      g.fillStyle = 'rgba(0,0,0,.42)';                  // blown-out windows
      for (let wy = base - bh * .75; wy < base - 4; wy += 15) for (let wx = x + 5; wx < x + bw - 8; wx += 12) if (Math.random() < .6) g.fillRect(wx, wy, 6, 8);
      g.fillStyle = theme.ruin;
      if (Math.random() < .3) fires.push(x + bw * rnd(.2, .8));
      x += bw + rnd(18, 80);
    } else if (kind < .78) {                            // dead tree
      const th = rnd(30, 62); g.lineWidth = 3; g.beginPath(); g.moveTo(x, base + 20); g.lineTo(x + rnd(-3, 3), base - th); g.stroke();
      g.lineWidth = 1.6; for (let k = 0; k < 4; k++) { const by = base - th * rnd(.3, 1), d = Math.random() < .5 ? -1 : 1; g.beginPath(); g.moveTo(x, by); g.lineTo(x + d * rnd(8, 18), by - rnd(6, 16)); g.stroke(); }
      x += rnd(26, 70);
    } else {                                            // utility pole with sagging wire
      const ph = rnd(60, 90); g.lineWidth = 3; g.beginPath(); g.moveTo(x, base + 20); g.lineTo(x, base - ph); g.stroke();
      g.lineWidth = 2; g.beginPath(); g.moveTo(x - 10, base - ph + 8); g.lineTo(x + 10, base - ph + 8); g.stroke();
      g.lineWidth = 1; g.beginPath(); g.moveTo(x + 10, base - ph + 8); g.quadraticCurveTo(x + 70, base - ph + 34, x + 140, base - ph + 8); g.stroke();
      x += rnd(100, 160);
    }
  }
  for (const [i, fx] of fires.slice(0, 3).entries()) {  // smoke columns rising from the wrecks
    if (theme.name !== 'Arid' || i === 0) { const fg = g.createRadialGradient(fx, base - 6, 0, fx, base - 6, 46); fg.addColorStop(0, 'rgba(255,150,50,.55)'); fg.addColorStop(1, 'rgba(255,100,20,0)'); g.fillStyle = fg; g.fillRect(fx - 50, base - 56, 100, 100); }
    let px = fx, py = base - 12;
    for (let j = 0; j < 46; j++) {
      px += rnd(-.5, 1.6); py -= rnd(5, 8); const pr = 7 + j * .85;
      g.fillStyle = `rgba(${theme.haze},${Math.max(0, .26 - j * .0045)})`; g.beginPath(); g.arc(px, py, pr, 0, TAU); g.fill();
    }
  }
  const haze = g.createLinearGradient(0, H * .5, 0, H * .85);
  haze.addColorStop(0, 'rgba(255,255,255,0)'); haze.addColorStop(1, 'rgba(255,255,255,.12)');
  g.fillStyle = haze; g.fillRect(0, H * .5, W, H * .4);
  return c;
}

function renderTex() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  for (let i = 0; i < 9000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.06)'; g.fillRect(rnd(0, W), rnd(0, H), rnd(1, 3), rnd(1, 3)); }
  for (let i = 0; i < 90; i++) {
    g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.08)';
    g.beginPath(); g.ellipse(rnd(0, W), rnd(GROUND_MIN, H), rnd(3, 9), rnd(2, 5), rnd(0, 3), 0, TAU); g.fill();
  }
  return c;
}

function makeScene(forceTheme, gdata) {
  themeIdx = forceTheme != null ? forceTheme : Math.floor(Math.random() * THEMES.length);
  theme = THEMES[themeIdx];
  if (gdata) ground = Float32Array.from(gdata, v => v / 10); else makeTerrain();   // wire format is tenths of a pixel
  bgCanvas = renderBG();
  if (!texCanvas) texCanvas = renderTex();
  scorches = [];
  clouds = Array.from({length: 7}, () => ({x: rnd(0, W), y: rnd(70, 260), s: rnd(.7, 1.6), v: rnd(.05, .18)}));
  stars = Array.from({length: theme.stars}, () => ({x: rnd(0, W), y: rnd(0, H * .55), r: rnd(.5, 1.7), ph: rnd(0, 9)}));
  streaks = Array.from({length: 46}, () => ({x: rnd(0, W), y: rnd(80, H - 160), l: rnd(14, 34), s: rnd(.6, 1.4)}));
}

// ====================================================== tanks & turns
function tiltAt(x) {
  const i0 = clamp(Math.floor(x - 11), 0, W - 1), i1 = clamp(Math.floor(x + 11), 0, W - 1);
  return Math.atan2(ground[i1] - ground[i0], Math.max(1, i1 - i0));
}
function newTank(i) {
  const slot = W / numPlayers, x = slot * i + rnd(slot * 0.25, slot * 0.75);
  return {i, x, y: ground[Math.floor(x)] - 4, hp: 100, shownHp: 100, angle: x < W / 2 ? 55 : 125, power: 55, weapon: 0,
          ammo: WEAPONS.map(w => w.ammo), fuel: 60, color: COLORS[i], vy: 0, special: null, ai: net ? !net.occ[i] : i >= numHumans,
          tilt: tiltAt(x), recoil: 0, dead: false};
}
function startRound() {
  makeScene();
  tanks = Array.from({length: numPlayers}, (_, i) => newTank(i));
  shots = []; parts = []; rings = []; flashes = []; popups = []; pending = []; wheel = null; winner = -1; evq = [];
  hit = [false, false, false, false]; shake = 0; whiteFlash = 0; paused = false; terrainDirty = false; sandActive = false;
  mode = 'play';
  if (net && net.role === 'host') bcast({t: 'round', th: themeIdx, g: Array.from(ground, v => Math.round(v * 10)), np: numPlayers, ai: tanks.map(t => t.ai)});
  beginTurn(Math.floor(Math.random() * numPlayers));
}
// who controls a tank on this machine? (offline hot-seat: everyone; online: only your own seat)
const isMine = t => !net || t.i === net.seat;
function nextAlive(from) {
  for (let k = 1; k <= numPlayers; k++) { const n = (from + k) % numPlayers; if (tanks[n].hp > 0) return n; }
  return from;
}
function beginTurn(t) {
  turn = t; state = 'aim'; wind = Math.round(rnd(-10, 10));
  tanks[t].fuel = 60; aiPlan = null; aiTimer = 80;
  turnFrames = net && !tanks[t].ai ? TURN_SECONDS * 60 : 0;   // online humans get a shot clock so nobody can stall the game
  emit({t: 'turn', i: t});
}
function pivot(t) {   // world position of the turret pivot, accounting for hull tilt
  return {x: t.x + 22 * Math.sin(t.tilt), y: t.y + 4 - 22 * Math.cos(t.tilt)};
}
function muzzle(t) {
  const p = pivot(t), a = t.angle * Math.PI / 180;
  return {x: p.x + Math.cos(a) * 30, y: p.y - Math.sin(a) * 30};
}

// ====================================================== effects
function addP(o) { parts.push(Object.assign({life: 30, max: 0, g: 0, drag: 1, size: 3, type: 'spark', vx: 0, vy: 0, rot: rnd(0, TAU), vr: rnd(-.3, .3)}, o)); const p = parts[parts.length - 1]; p.max = p.life; }
function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(o.s0, o.s1); addP(Object.assign({}, o, {x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (o.up || 0), life: rnd(o.l0, o.l1), size: rnd(o.z0, o.z1)})); }
}
function confetti(x, y, n, spread = 6) {
  for (let i = 0; i < n; i++) addP({type: 'confetti', x, y, vx: rnd(-spread, spread), vy: rnd(-spread * 1.3, -1), g: .13, drag: .985, life: rnd(90, 170), size: rnd(4, 8), color: pick(['#facc15', '#f87171', '#4ade80', '#60a5fa', '#c084fc', '#fff'])});
}
function explosionFx(x, y, r, color) {
  flashes.push({x, y, r: r * 1.9, life: 10, max: 10});
  rings.push({x, y, r0: r * .3, r1: r * 2.2, life: 24, max: 24, color: 'rgba(255,230,170,1)', w: 4});
  rings.push({x, y, r0: r * .2, r1: r * 1.5, life: 18, max: 18, color: 'rgba(255,255,255,1)', w: 2});
  burst(x, y, r * 1.4, {type: 'fire', s0: .6, s1: 2.2 + r / 22, l0: 20, l1: 42, z0: 4, z1: 9, drag: .94, g: -.012});
  burst(x, y, r * .55, {type: 'spark', s0: 2, s1: 7 + r / 18, l0: 30, l1: 60, z0: 1, z1: 2, drag: .985, g: .1});
  burst(x, y, r / 4 + 3, {type: 'smoke', s0: .3, s1: 1.6, l0: 60, l1: 110, z0: 7, z1: 13, drag: .975, g: -.025, up: -.4});
  for (let i = 0; i < r * .55; i++) addP({type: 'dirt', x: x + rnd(-r * .5, r * .5), y, vx: rnd(-3, 3), vy: -rnd(1, 5.5), g: .13, life: rnd(40, 80), size: rnd(2, 4.5), color: pick(theme.dirt)});
  shake = Math.max(shake, Math.min(22, r / 5));
  if (r > 100) whiteFlash = .85;
  sfx.boom(r);
}
function popup(x, y, s, color, size = 22) { popups.push({x, y, s, color, size, life: 55, max: 55}); }

function updateFx() {
  T++;
  for (const p of parts) {
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr;
    if (p.type === 'dirt' && p.y >= ground[clamp(Math.floor(p.x), 0, W - 1)] && p.vy > 0) p.life = Math.min(p.life, 6);
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 40);
  if (parts.length > 1800) parts.splice(0, parts.length - 1800);
  for (const r of rings) r.life--; rings = rings.filter(r => r.life > 0);
  for (const f of flashes) f.life--; flashes = flashes.filter(f => f.life > 0);
  for (const p of popups) { p.y -= .7; p.life--; } popups = popups.filter(p => p.life > 0);
  shake *= .9; if (shake < .15) shake = 0; whiteFlash *= .9;
  const wv = mode === 'menu' ? 3 : wind;
  for (const c of clouds) { c.x += c.v + wv * .03; if (c.x > W + 120) c.x = -140; if (c.x < -140) c.x = W + 120; }
  for (const s of streaks) { s.x += wv * .55 * s.s; if (s.x > W + 40) s.x = -40; if (s.x < -40) s.x = W + 40; }
  if (banner && ++banner.t > 110) banner = null;
}

// ====================================================== firing & damage
function crater(cx, cy, r) {
  for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.ceil(cx + r)); x++) {
    const dx = x - cx, dy = Math.sqrt(r * r - dx * dx);
    if (ground[x] >= cy - dy && ground[x] <= cy + dy) ground[x] = Math.min(H, cy + dy);
  }
  disturbSand();
}
function fire() {
  const t = tanks[turn];
  let w = t.special;
  if (w) t.special = null;
  else { w = WEAPONS[t.weapon]; if (t.ammo[t.weapon] <= 0) return; t.ammo[t.weapon]--; }
  hit = [false, false, false, false];
  const m = muzzle(t), v = t.power * POWER_SCALE;
  for (let k = 0; k < w.shots; k++) {
    const a = (t.angle + (k - (w.shots - 1) / 2) * 7) * Math.PI / 180;
    shots.push({id: ++shotId, x: m.x, y: m.y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w, owner: turn, trail: [],
                bounces: w.kind === 'bounce' ? 3 : 0, split: w.kind === 'mirv'});
  }
  emit({t: 'fire', i: turn});
  state = 'fly';
}

// ---- events: visual/audio happenings. The host emits them (and also sends them to clients); everyone plays them locally.
function emit(e) { applyEvent(e); if (net && net.role === 'host') evq.push(e); }
function applyEvent(e) {
  switch (e.t) {
    case 'turn': {
      const t = tanks[e.i]; if (!t) return;
      banner = {t: 0, text: `UNIT ${e.i + 1} — FIRE MISSION`, color: t.color,
                sub: t.ai ? 'CPU' : (net ? (isMine(t) ? 'YOUR ORDERS' : 'ALLIED COMMAND') : 'YOUR ORDERS')};
      if (net && isMine(t) && !t.ai) sfx.prize();
      break;
    }
    case 'fire': {
      const t = tanks[e.i]; if (!t) return;
      const m = muzzle(t);
      t.recoil = 8; shake = Math.max(shake, 3);
      burst(m.x, m.y, 10, {type: 'fire', s0: .5, s1: 3, l0: 8, l1: 16, z0: 3, z1: 6, drag: .9});
      burst(m.x, m.y, 8, {type: 'smoke', s0: .2, s1: 1, l0: 30, l1: 50, z0: 4, z1: 7, drag: .96, g: -.02});
      sfx.fire(); break;
    }
    case 'boom': scorches.push({x: e.x, y: e.y, r: e.r * 1.5}); if (scorches.length > 40) scorches.shift(); explosionFx(e.x, e.y, e.r); break;
    case 'bang': explosionFx(e.x, e.y, e.r); break;
    case 'dirt': {
      for (let i = 0; i < 50; i++) addP({type: 'dirt', x: e.x + rnd(-e.r, e.r), y: e.y - rnd(0, e.r), vx: rnd(-1.5, 1.5), vy: rnd(-3, 0), g: .1, life: rnd(30, 60), size: rnd(2, 5), color: pick(theme.dirt)});
      rings.push({x: e.x, y: e.y, r0: 8, r1: e.r * 1.5, life: 20, max: 20, color: 'rgba(210,160,90,1)', w: 3});
      shake = Math.max(shake, 4); sfx.boom(20); break;
    }
    case 'warp': {
      rings.push({x: e.x, y: e.y, r0: 6, r1: 46, life: 22, max: 22, color: 'rgba(94,234,212,1)', w: 3});
      rings.push({x: e.x, y: e.y, r0: 2, r1: 28, life: 16, max: 16, color: 'rgba(255,255,255,1)', w: 2});
      burst(e.x, e.y, 28, {type: 'spark', s0: 1, s1: 4, l0: 20, l1: 40, z0: 1.5, z1: 2.5, drag: .96, g: -.02, up: -1});
      break;
    }
    case 'ring': rings.push({x: e.x, y: e.y, r0: e.r0, r1: e.r1, life: e.life, max: e.life, color: e.color, w: e.w}); break;
    case 'pop': popup(e.x, e.y, e.s, e.c, e.z); break;
    case 'conf': confetti(e.x, e.y, e.n, e.sp); break;
    case 'sfx': sfx[e.n] && sfx[e.n](); break;
  }
}

function explode(x, y, w, owner) {
  if (w.kind === 'dirt') {
    for (let px = Math.max(0, Math.floor(x - w.radius)); px <= Math.min(W - 1, Math.ceil(x + w.radius)); px++) {
      const dy = Math.sqrt(Math.max(0, w.radius * w.radius - (px - x) ** 2));
      if (ground[px] > y - dy) ground[px] = Math.max(60, y - dy);
    }
    terrainDirty = true; disturbSand();
    emit({t: 'dirt', x, y, r: w.radius});
    return;
  }
  if (w.kind === 'teleport') {
    const t = tanks[owner], nx = clamp(x, 16, W - 16);
    emit({t: 'warp', x: t.x, y: t.y - 8});
    t.x = nx; t.y = ground[Math.floor(nx)] - 4; t.vy = 0; t.tilt = tiltAt(nx);
    emit({t: 'warp', x: t.x, y: t.y - 8});
    emit({t: 'pop', x: t.x, y: t.y - 56, s: 'REDEPLOYED!', c: '#5eead4', z: 22});
    emit({t: 'sfx', n: 'prize'});
    return;
  }
  if (w.kind === 'air') {
    for (let i = 0; i < 6; i++) pending.push({id: ++shotId, x: x + (i - 2.5) * 38, y: -20 - i * 25, vx: 0, vy: 3, w: CHILD, owner, trail: [], bounces: 0});
  }
  crater(x, y, w.radius);
  terrainDirty = true;
  emit({t: 'boom', x, y, r: w.radius});
  let dealt = 0;
  for (const t of tanks) {
    const d = Math.hypot(t.x - x, t.y - 8 - y);
    if (t.hp > 0 && d < w.radius + 14) {
      const dmg = Math.round(w.damage * (1 - Math.max(0, d - 14) / w.radius));
      if (dmg <= 0) continue;
      t.hp -= dmg; emit({t: 'pop', x: t.x, y: t.y - 56, s: '-' + dmg, c: '#ff6b5e', z: 22 + dmg / 8});
      if (t.i !== owner) { hit[owner] = true; dealt += dmg; emit({t: 'sfx', n: 'hit'}); }
    }
  }
  if (w.kind === 'vamp' && dealt) {
    const o = tanks[owner]; o.hp = Math.min(100, o.hp + dealt);
    emit({t: 'pop', x: o.x, y: o.y - 56, s: '+' + dealt, c: '#a3e635', z: 22});
  }
}

function simulate(sx, sy, angle, power, windv, collect) {
  const a = angle * Math.PI / 180, v = power * POWER_SCALE;
  let x = sx, y = sy, vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let i = 0; i < 2000; i++) {
    vx += windv * WIND_SCALE; vy += G; x += vx; y += vy;
    if (collect && i < collect && i % 3 === 0) collect.pts.push([x, y]);
    if (x < 0 || x >= W) return {x, y, out: true};
    if (y >= ground[Math.floor(x)]) return {x, y};
  }
  return {x, y};
}
function previewPoints(t) {
  const m = muzzle(t), a = t.angle * Math.PI / 180, v = t.power * POWER_SCALE, pts = [];
  let x = m.x, y = m.y, vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let i = 0; i < 66; i++) {
    vx += wind * WIND_SCALE; vy += G; x += vx; y += vy;
    if (x < 0 || x >= W || y >= ground[Math.floor(x)]) break;
    if (i % 4 === 3) pts.push([x, y]);
  }
  return pts;
}

function aiThink(t) {
  const targets = tanks.filter(o => o.i !== t.i && o.hp > 0);
  if (!targets.length) return fire();
  let best = null;
  const m = muzzle(t);
  for (let a = 20; a <= 160; a += 2) for (let p = 20; p <= 100; p += 2) {
    const r = simulate(m.x, m.y, a, p, wind);
    if (r.out) continue;
    const d = Math.min(...targets.map(o => Math.hypot(r.x - o.x, r.y - o.y)));
    if (!best || d < best.d) best = {a, p, d};
  }
  if (!best) best = {a: 90, p: 50, d: 999};
  const err = 5;
  aiPlan = {a: best.a + rnd(-err, err), p: clamp(best.p + rnd(-err, err), 20, 100), weapon: 0};
  if (t.ammo[1] > 0 && best.d < 40 && Math.random() < .6) aiPlan.weapon = 1;
  else if (t.ammo[2] > 0 && Math.random() < .3) aiPlan.weapon = 2;
  t.weapon = aiPlan.weapon;
}

// ====================================================== update
// per-frame cosmetic tank state (health bar easing, recoil, hull tilt, damage smoke) — runs on every machine
function tankCosmetics(t) {
  t.shownHp += (Math.max(0, t.hp) - t.shownHp) * .12;
  t.recoil *= .84;
  t.tilt = lerp(t.tilt, tiltAt(t.x), .2);
  if (t.dead && T % 5 === 0) addP({type: 'smoke', x: t.x + rnd(-8, 8), y: t.y - 10, vx: rnd(-.2, .2), vy: -rnd(.5, 1.2), g: -.01, life: rnd(50, 90), size: rnd(5, 9), drag: .98});
  else if (!t.dead && t.hp < 35 && T % 9 === 0) addP({type: 'smoke', x: t.x + rnd(-8, 8), y: t.y - 12, vx: rnd(-.2, .2), vy: -rnd(.4, 1), g: -.01, life: rnd(40, 70), size: rnd(3, 6), drag: .98});
}
// keyboard aiming/driving for a human-controlled tank on THIS machine
function humanControl(t) {
  const fine = keys['shift'] ? 0.2 : 1;
  if (keys['arrowleft'])  t.angle = Math.min(180, t.angle + fine);
  if (keys['arrowright']) t.angle = Math.max(0, t.angle - fine);
  if (keys['arrowup'])    t.power = Math.min(100, t.power + fine * 0.6);
  if (keys['arrowdown'])  t.power = Math.max(5, t.power - fine * 0.6);
  const dir = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
  if (dir && t.fuel > 0) {
    const nx = clamp(t.x + dir * 0.8, 14, W - 14);
    if (nx !== t.x && Math.abs(ground[Math.floor(nx)] - ground[Math.floor(t.x)]) < 2.5) {
      t.x = nx; t.fuel -= 0.5;
      if (T % 4 === 0) addP({type: 'smoke', x: t.x - dir * 14, y: t.y + 3, vx: -dir * .4, vy: -.3, g: -.005, life: 25, size: 3, drag: .95});
    }
  }
}

function update() {
  if (net && net.role === 'client' && mode === 'play') { updateClient(); return; }
  updateGame();
  if (net && net.role === 'host' && mode === 'play' && (T & 1) === 0) netBroadcast();
}

function updateGame() {
  updateFx();
  if (mode === 'menu') {
    for (const t of menuTanks) { t.angle = 90 + Math.sin(T * .02 + t.i * 1.7) * 55; t.recoil *= .85; }
    return;
  }
  if (paused) return;

  if (sandActive) {   // loose sand keeps sliding until every slope is at its angle of repose
    let mv = 0; for (let s = 0; s < 8; s++) mv += sandStep(s === 0);
    if (mv > 1.0) { sandQuiet = 0; terrainDirty = true; } else if (++sandQuiet > 8) { sandActive = false; terrainDirty = true; }
    if (++sandFrames > 240) { sandActive = false; terrainDirty = true; }   // never hold up the game for more than ~4 s
  }

  for (const t of tanks) {
    tankCosmetics(t);
    const gy = ground[clamp(Math.floor(t.x), 0, W - 1)] - 4;
    if (t.y < gy) {
      t.vy += G; t.y = Math.min(gy, t.y + t.vy);
      if (t.y >= gy) {
        if (t.vy > 4 && t.hp > 0) { const d = Math.round((t.vy - 4) * 6); t.hp -= d; emit({t: 'pop', x: t.x, y: t.y - 50, s: '-' + d, c: '#ffb347', z: 18}); }
        t.vy = 0;
      }
    } else { t.y = gy; t.vy = 0; }
    if (t.hp <= 0 && !t.dead) {
      t.dead = true; t.hp = 0;
      emit({t: 'bang', x: t.x, y: t.y - 8, r: 42});
      emit({t: 'pop', x: t.x, y: t.y - 60, s: 'DESTROYED', c: '#fff', z: 20});
    }
  }

  if (state === 'aim') {
    const t = tanks[turn];
    if (t.ai) {
      if (--aiTimer <= 0) {
        if (!aiPlan) { aiThink(t); aiTimer = 30; }
        else if (aiPlan) {
          t.angle += Math.sign(aiPlan.a - t.angle) * Math.min(2, Math.abs(aiPlan.a - t.angle));
          t.power += Math.sign(aiPlan.p - t.power) * Math.min(1.5, Math.abs(aiPlan.p - t.power));
          if (Math.abs(aiPlan.a - t.angle) < .1 && Math.abs(aiPlan.p - t.power) < .1) fire();
        }
      }
    } else if (isMine(t)) humanControl(t);
    // (online: other players' angle/power/position arrive as 'in' messages)
    if (turnFrames > 0 && --turnFrames === 0 && !t.ai) {
      emit({t: 'pop', x: t.x, y: t.y - 72, s: 'TIME UP!', c: '#fca5a5', z: 20});
      beginTurn(nextAlive(turn));
    }
  }
  turnLeft = turnFrames > 0 && state === 'aim' ? Math.ceil(turnFrames / 60) : 0;

  if (state === 'fly') {
    for (const s of shots) {
      s.vx += wind * WIND_SCALE; s.vy += G; s.x += s.vx; s.y += s.vy;
      s.trail.push([s.x, s.y]); if (s.trail.length > 36) s.trail.shift();
      if (T % 2 === 0) addP({type: 'smoke', x: s.x, y: s.y, vx: rnd(-.1, .1), vy: rnd(-.1, .1), life: 26, size: 2.5, drag: .98});
      if (s.split && s.vy > 0) {   // MIRV splits at the top of its arc
        s.dead = true;
        emit({t: 'ring', x: s.x, y: s.y, r0: 4, r1: 30, life: 14, color: 'rgba(255,200,80,1)', w: 2});
        for (let k = -2; k <= 2; k++) pending.push({id: ++shotId, x: s.x, y: s.y, vx: s.vx + k * 0.9, vy: s.vy, w: CHILD, owner: s.owner, trail: [], bounces: 0});
        continue;
      }
      const onGround = s.x >= 0 && s.x < W && s.y >= 0 && s.y >= ground[Math.floor(s.x)];
      let boom = s.x < 0 || s.x >= W || s.y >= H;
      if (onGround && s.bounces > 0) {
        s.bounces--; s.y = ground[Math.floor(s.x)] - 2; s.vy *= -0.7; s.vx *= 0.9;
        explode(s.x, s.y, {radius: 14, damage: 15, kind: 'child', color: s.w.color}, s.owner);
        continue;
      }
      if (onGround) boom = true;
      if (!boom && s.w.kind !== 'teleport') for (const t of tanks) if (t.hp > 0 && Math.hypot(s.x - t.x, s.y - (t.y - 8)) < 13) boom = true;
      if (boom) { s.dead = true; if (s.x >= 0 && s.x < W) explode(s.x, Math.min(s.y, H), s.w, s.owner); }
    }
    shots = shots.filter(s => !s.dead).concat(pending); pending = [];
    if (!shots.length) { state = 'settle'; aiTimer = 45; }
  }

  if (state === 'quick' && qte) {
    const q = qte;
    if (!q.done) {
      q.t++;
      if (tanks[turn].ai && !q.ai) q.ai = {next: 14, failAt: Math.random() < .65 ? -1 : Math.floor(rnd(1, 4))};   // CPU nails it ~65% of the time
      if (q.ai && --q.ai.next <= 0) { qteKey(q.idx === q.ai.failAt ? 'x' : q.seq[q.idx]); q.ai.next = Math.floor(rnd(8, 13)); }
      if (!q.done && q.t > q.limit) qteEnd(false, 'TIMED OUT!');
    } else if (++q.resT > 55) { qte = null; if (q.ok) startWheel(); else beginTurn(nextAlive(turn)); }
  }

  if (state === 'wheel') {
    wheelTicks();
    if (wheel.t === wheel.spin) {
      tanks[turn].special = SPECIALS[wheel.idx];
      emit({t: 'conf', x: W / 2, y: H / 2, n: 90, sp: 7}); emit({t: 'sfx', n: 'prize'});
    }
    if (wheel.t > wheel.spin + 130) { wheel = null; beginTurn(nextAlive(turn)); }
  }

  if (state === 'settle' && --aiTimer <= 0) {
    const falling = sandActive || tanks.some(t => t.hp > 0 && (t.vy > 0 || t.y < ground[clamp(Math.floor(t.x), 0, W - 1)] - 4.5));
    if (!falling) {
      const alive = tanks.filter(t => t.hp > 0);
      if (alive.length <= 1) {
        state = 'over';
        winner = alive.length ? alive[0].i : -1;
        if (winner >= 0) { wins[winner]++; emit({t: 'conf', x: W / 2, y: H * .3, n: 140, sp: 8}); emit({t: 'sfx', n: 'win'}); }
      } else if (hit[turn] && tanks[turn].hp > 0) {
        hit = [false, false, false, false];
        startQuick();
      } else beginTurn(nextAlive(turn));
    }
  }
  if (state === 'over' && T % 6 === 0 && winner >= 0) confetti(rnd(0, W), -10, 3, 2);
}
// ---- hit -> key combo -> prize wheel
function startQuick() {
  qte = {seq: shuffled(['w', 'a', 's', 'd']), idx: 0, t: 0, limit: QTE_FRAMES + (net ? 12 : 0), done: false, ok: false, resT: 0, msg: '', ai: null};  // a little grace for network lag
  state = 'quick';
  emit({t: 'sfx', n: 'hit'});
}
function startWheel() {
  wheel = {t: 0, spin: 210, idx: Math.floor(Math.random() * SPECIALS.length), flick: 0};
  state = 'wheel';
}
function qteKey(k) {
  const q = qte;
  if (state !== 'quick' || !q || q.done) return;
  if (k === q.seq[q.idx]) { q.idx++; emit({t: 'sfx', n: 'tick'}); if (q.idx >= q.seq.length) qteEnd(true, 'AUTHORIZED!'); }
  else qteEnd(false, 'ACCESS DENIED!');
}
function qteEnd(ok, msg) {
  const q = qte, t = tanks[turn];
  q.done = true; q.ok = ok; q.msg = msg;
  emit({t: 'pop', x: t.x, y: t.y - 72, s: msg, c: ok ? '#86efac' : '#fca5a5', z: 22});
  emit({t: 'sfx', n: ok ? 'prize' : 'fail'});
}
function wheelTicks() {   // shared by host and clients: spin animation + tick sounds
  const prev = wheel.t++;
  const step = TAU / SPECIALS.length, slice = R => Math.floor((((-R) % TAU) + TAU) % TAU / step);
  if (slice(wheelAngle(prev)) !== slice(wheelAngle(wheel.t)) && wheel.t < wheel.spin) { sfx.tick(); wheel.flick = 1; }
  wheel.flick *= .85;
}
function wheelAngle(t) {
  const step = TAU / SPECIALS.length, p = Math.min(1, t / wheel.spin);
  return (TAU * 6 - (wheel.idx + .5) * step) * (1 - Math.pow(1 - p, 4));
}

// ====================================================== networking (WebRTC via PeerJS; host-authoritative)

    ctx.beginPath(); ctx.moveTo(p.x + c * 46, p.y - s * 46); ctx.lineTo(p.x + c * (46 + r), p.y - s * (46 + r)); ctx.stroke();

    pts.forEach(([x, y], i) => {

}

function drawShots() {
  for (const s of shots) {
    const c = s.w.color || '#fff';
    ctx.lineCap = 'round';
    for (let i = 1; i < s.trail.length; i++) {

      ctx.beginPath(); ctx.moveTo(s.trail[i - 1][0], s.trail[i - 1][1]); ctx.lineTo(s.trail[i][0], s.trail[i][1]); ctx.stroke();
    }

    ctx.save(); glow(c, 16); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.w.radius > 50 ? 5 : 3.4, 0, TAU); ctx.fill(); ctx.restore();

}

function drawParts() {
  for (const p of parts) {
    const t = p.life / p.max;
    if (p.type === 'fire') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.fillStyle = `hsl(${12 + t * 42},100%,${40 + t * 22}%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.35 + t), 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'smoke') {
      ctx.globalAlpha = t * .4; ctx.fillStyle = '#5b5d68';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - t) * 1.8), 0, TAU); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = t; ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'dirt') {
      ctx.globalAlpha = Math.min(1, t * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
    } else if (p.type === 'confetti') {
      ctx.globalAlpha = Math.min(1, t * 2); ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.7)) + .2);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.globalAlpha = t; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * t + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r1, r.r0, t), 0, TAU); ctx.stroke();
  }
  for (const f of flashes) {
    const t = f.life / f.max, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(255,250,220,${t})`); g.addColorStop(.4, `rgba(255,170,60,${t * .55})`); g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.min(1, t * 2.2);
    text(p.s, p.x, p.y, p.size * (1 + (1 - t) * .15), p.color, 'center', '900', 'rgba(0,0,0,.75)');
  }
  ctx.globalAlpha = 1;
}

function drawWorld(actors) {
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBackdrop(); drawWindStreaks(); drawTerrain();
  for (const t of actors) if (t.hp <= 0) drawTank(t, false);
  for (const t of actors) if (t.hp > 0) drawTank(t, mode === 'play' && state === 'aim' && t.i === turn);
  if (mode === 'play' && state === 'aim' && !paused) drawAimHelpers(tanks[turn]);
  drawShots(); drawParts();
  ctx.restore();
  if (!vigCanvas) {   // darkened corners + a faint olive grade, like a battlefield camera feed
    vigCanvas = document.createElement('canvas'); vigCanvas.width = W; vigCanvas.height = H;
    const v = vigCanvas.getContext('2d'), vg = v.createRadialGradient(W / 2, H / 2, H * .42, W / 2, H / 2, W * .66);
    vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(6,8,4,.5)'); v.fillStyle = vg; v.fillRect(0, 0, W, H);
    v.fillStyle = 'rgba(60,70,30,.07)'; v.fillRect(0, 0, W, H);

function drawWheel() {

  ctx.fillStyle = 'rgba(8,10,5,.93)'; ctx.fillRect(0, 0, W, H);
  // rotating rays
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(T * .004);
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 720, 0, TAU / 36); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  text(`SUPPLY DROP — UNIT 0${turn + 1}`, cx, 52, 34, t.color, 'center', '900', 'rgba(0,0,0,.6)');
  text(done ? 'SUPPLY DROP AUTHORIZED' : 'REQUISITIONING SUPPLIES…', cx, 88, 15, 'rgba(255,255,255,.7)', 'center', '800');
  // outer ring
  ctx.save(); glow(done ? SPECIALS[wheel.idx].color : '#facc15', 26);
  ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, TAU); ctx.fillStyle = '#1d2016'; ctx.fill(); noGlow();
  ctx.strokeStyle = '#d4a417'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();

    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (r + 11), cy + Math.sin(a) * (r + 11), 4, 0, TAU); ctx.fill(); noGlow();
  }
  // slices
  for (let i = 0; i < n; i++) {
    const a0 = R + i * step - Math.PI / 2, sp = SPECIALS[i], win = done && i === wheel.idx;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
    g.addColorStop(0, shade(sp.color, .08)); g.addColorStop(1, shade(sp.color, -.42));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a0 + step); ctx.closePath(); ctx.fill();
    if (win && Math.floor(T / 8) % 2) { ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + step / 2);
    text(sp.name, r - 14, 0, 14, '#fff', 'right', '900', 'rgba(0,0,0,.45)');
    ctx.save(); ctx.translate(r - 112, 0); ctx.rotate(Math.PI / 2); text(sp.icon, 0, 0, 28, '#fff', 'center'); ctx.restore();
    ctx.restore();
  }
  ctx.fillStyle = '#1d2016'; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#d4a417'; ctx.lineWidth = 3; ctx.stroke();
  text('★', cx, cy + 1, 22, '#d4a417', 'center', '900');
  // pointer
  ctx.save(); ctx.translate(cx, cy - r - 24); ctx.rotate(wheel.flick * .35);
  glow('#000', 8); ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(0, 38); ctx.lineTo(-15, 4); ctx.lineTo(15, 4); ctx.closePath(); ctx.fill();
  noGlow(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  if (done) {
    const sp = SPECIALS[wheel.idx], k = Math.min(1, (wheel.t - wheel.spin) / 14), y = H - 72;
    ctx.save(); ctx.translate(cx, y); ctx.scale(.7 + .3 * k, .7 + .3 * k); ctx.globalAlpha = k;
    glow(sp.color, 22); panel(-250, -34, 500, 68, 20, sp.color, 3); noGlow();
    text(sp.icon, -212, 2, 34, '#fff', 'center');
    text(sp.name, -178, -10, 24, '#fff', 'left', '900');
    text(sp.desc + ' — loaded for your next shot', -178, 16, 13, 'rgba(255,255,255,.75)', 'left', '600');
    ctx.restore();
  }
  drawParts();
}

function drawOver() {
  ctx.fillStyle = 'rgba(8,10,5,.62)'; ctx.fillRect(0, 0, W, H);
  const col = winner >= 0 ? COLORS[winner] : '#fff';
  ctx.save(); glow(col, 28); panel(W / 2 - 300, 150, 600, 200, 24, col, 3); noGlow(); ctx.restore();
  text(winner >= 0 ? '🏆' : '🤝', W / 2, 200, 44, '#fff', 'center');
  text(winner >= 0 ? `UNIT 0${winner + 1} HOLDS THE FIELD` : 'STALEMATE', W / 2, 262, 38, col, 'center', '900', 'rgba(0,0,0,.6)');
  const n = tanks.length, sw = 120, x0 = W / 2 - (n * sw) / 2;
  tanks.forEach((t, i) => {
    const x = x0 + i * sw + sw / 2;
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(x - 24, 316, 11, 0, TAU); ctx.fill();
    text(`0${i + 1}`, x - 24, 317, 11, '#15160f', 'center', '900');
    text('★ ' + wins[i], x + 4, 317, 17, '#fcd34d', 'left', '800');
  });
  const hint = net && net.role === 'client' ? 'Waiting for the host to start the next round…     ·     ESC  leave'
    : `ENTER  next round     ·     ESC  ${net ? 'close room' : 'main menu'}`;
  text(hint, W / 2, 395, 16, '#fff', 'center', '700', 'rgba(0,0,0,.6)');

}

// ====================================================== drawing: menu
function button(x, y, w, h, big, sub, key, color, action) {
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  menuButtons.push({x, y, w, h, action});
  ctx.save(); if (hov) glow(color, 24);
  rr(x, y, w, h, 16);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, hov ? 'rgba(84,92,60,.96)' : 'rgba(50,56,38,.94)'); g.addColorStop(1, hov ? 'rgba(40,46,28,.96)' : 'rgba(22,25,16,.94)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hov ? color : 'rgba(214,204,150,.32)'; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
  if (hov) hazard(x + 4, y + h - 8, w - 8, 4, .9);
  text(big, x + w / 2, y + h * .42, 40, INK, 'center', '900', 'rgba(0,0,0,.45)');
  text(sub, x + w / 2, y + h * .74, 13, INK_DIM, 'center', '700');
  if (key) text('[' + key + ']', x + 12, y + 14, 11, INK_DIM, 'left', '800');
  return hov;
}

function smallBtn(x, y, w, h, label, color, action, filled) {
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  menuButtons.push({x, y, w, h, action});
  ctx.save(); if (hov || filled) glow(color, hov ? 22 : 12);
  rr(x, y, w, h, 12); ctx.fillStyle = filled ? color : hov ? 'rgba(84,92,60,.95)' : 'rgba(40,45,30,.92)'; ctx.fill();
  ctx.strokeStyle = hov ? color : 'rgba(214,204,150,.32)'; ctx.lineWidth = 2; ctx.stroke(); ctx.restore();
  text(label, x + w / 2, y + h / 2 + 1, 16, filled ? '#15160f' : INK, 'center', '900');
  return hov;
}
function pickCount(n) { numPlayers = n; menuStage = 'humans'; sfx.click(); }
function pickHumans(n) { numHumans = n; wins = [0, 0, 0, 0]; sfx.click(); startRound(); }
function startOnline() { if (!net || net.role !== 'host' || net.status !== 'ready') return; wins = [0, 0, 0, 0]; sfx.click(); startRound(); }
function copyInvite() {
  const link = inviteLink();
  const done = () => { copiedAt = T; };
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => window.prompt('Copy this invite link:', link));
  else window.prompt('Copy this invite link:', link);
}

function drawLobby() {
  const host = net && net.role === 'host';
  text(host ? 'YOUR ROOM' : 'ROOM LOBBY', W / 2, 188, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
  panel(W / 2 - 190, 206, 380, 78, 16, '#d4a417', 2);
  try { ctx.letterSpacing = '10px'; } catch (e) {}
  text(net.code, W / 2 + 5, 246, 54, '#fff', 'center', '900');
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  const status = host && net.status !== 'ready' ? 'Opening room…' : host ? 'Share the code or the invite link with your friends' : 'Connected — waiting for the host to start';
  text(status, W / 2, 298, 13, 'rgba(255,255,255,.75)', 'center', '700', 'rgba(0,0,0,.5)');
  for (let i = 0; i < numPlayers; i++) {
    const y = 316 + i * 50, taken = net.occ[i], me = i === net.seat;
    panel(W / 2 - 260, y, 520, 42, 12, me ? COLORS[i] : 'rgba(255,255,255,.14)', me ? 2 : 1.2);
    ctx.fillStyle = COLORS[i]; ctx.beginPath(); ctx.arc(W / 2 - 232, y + 21, 14, 0, TAU); ctx.fill();
    text('0' + (i + 1), W / 2 - 232, y + 22, 13, '#15160f', 'center', '900');
    text('UNIT 0' + (i + 1), W / 2 - 205, y + 21, 15, '#fff', 'left', '800');
    const label = i === 0 ? (host ? 'HOST — you' : 'HOST') : taken ? (me ? 'YOU' : 'CONNECTED') : 'Open slot  ·  CPU if left empty';
    text(label, W / 2 + 244, y + 22, 13, taken ? (me ? COLORS[i] : '#86efac') : 'rgba(255,255,255,.4)', 'right', taken ? '800' : '600');
  }
  const by = 316 + numPlayers * 50 + 6;
  if (host) {
    const copied = T - copiedAt < 120;
    smallBtn(W / 2 - 260, by, 250, 46, copied ? '✓ LINK COPIED' : '🔗 COPY INVITE LINK', '#7f9fc0', copyInvite, false);
    smallBtn(W / 2 + 10, by, 250, 46, net.status === 'ready' ? '▶ START GAME' : 'OPENING…', '#9cc255', startOnline, net.status === 'ready');
    text('Empty slots will be filled by CPU tanks.   Esc closes the room.', W / 2, by + 66, 12, 'rgba(255,255,255,.55)', 'center', '600', 'rgba(0,0,0,.5)');
  } else {
    smallBtn(W / 2 - 80, by, 160, 46, 'LEAVE', '#c0583d', () => leaveRoom(), false);
  }
}

function drawOnlineMenus() {
  let any = false;
  if (menuStage === 'join') {
    text('ENTER ROOM CODE', W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    panel(W / 2 - 190, 220, 380, 84, 16, '#d4a417', 2);
    try { ctx.letterSpacing = '10px'; } catch (e) {}
    text(codeInput + (Math.floor(T / 30) % 2 ? '_' : ' '), W / 2 + 5, 262, 54, '#fff', 'center', '900');
    try { ctx.letterSpacing = '0px'; } catch (e) {}
    if (smallBtn(W / 2 - 190, 322, 185, 46, 'JOIN', '#9cc255', () => joinRoom(codeInput), codeInput.length >= 4)) any = true;
    if (smallBtn(W / 2 + 5, 322, 185, 46, 'BACK', '#fff', () => { menuStage = 'home'; netMsg = ''; sfx.click(); }, false)) any = true;

  } else if (menuStage === 'connecting') {
    text(`CONNECTING TO ROOM ${net ? net.code : ''}…`, W / 2, 250, 24, '#fff', 'center', '900', 'rgba(0,0,0,.6)');
    text('(this can take a few seconds)', W / 2, 284, 13, 'rgba(255,255,255,.7)', 'center', '600');
    if (smallBtn(W / 2 - 80, 320, 160, 46, 'CANCEL', '#c0583d', () => leaveRoom(), false)) any = true;
  } else if (menuStage === 'lobby' && net) {
    drawLobby(); any = true;
  }
  if (netMsg && menuStage !== 'lobby') text(netMsg, W / 2, menuStage === 'join' ? 436 : 190, 14, '#fca5a5', 'center', '800', 'rgba(0,0,0,.6)');
  cv.style.cursor = any ? 'pointer' : 'default';
  drawParts();
}

function drawMenu() {
  menuButtons = [];
  ctx.fillStyle = 'rgba(8,10,5,.38)'; ctx.fillRect(0, 0, W, H);
  // title: stencil lettering on a hazard-striped banner
  hazard(W / 2 - 340, 36, 680, 7, .85); hazard(W / 2 - 340, 126, 680, 7, .85);
  try { ctx.letterSpacing = '9px'; } catch (e) {}
  ctx.font = `900 76px ${FONT}`; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(0, 55, 0, 112); tg.addColorStop(0, '#f1e9bd'); tg.addColorStop(.55, '#bdb06c'); tg.addColorStop(1, '#7a7440');
  ctx.lineWidth = 11; ctx.strokeStyle = 'rgba(14,16,8,.95)'; ctx.lineJoin = 'miter'; ctx.strokeText('SCORCHED TANKS', W / 2, 83);
  ctx.save(); glow('rgba(0,0,0,.7)', 14); ctx.fillStyle = tg; ctx.fillText('SCORCHED TANKS', W / 2, 83); ctx.restore();
  ctx.fillStyle = 'rgba(14,16,8,.9)'; for (const sx of [W / 2 - 128, W / 2 + 118, W / 2 - 330 + 150]) ctx.fillRect(sx, 52, 3, 62);   // stencil bridges
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  text('ARMORED ARTILLERY COMMAND  ·  DESTRUCTIBLE TERRAIN  ·  SUPPLY DROPS  ·  ONLINE OPS', W / 2, 153, 14, INK, 'center', '800', 'rgba(0,0,0,.6)');

  if (['join', 'connecting', 'lobby'].includes(menuStage)) { drawOnlineMenus(); return; }
  let any = false;
  if (menuStage === 'home') {
    text('SELECT DEPLOYMENT', W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    const opts = [
      ['LOCAL', 'Same screen · friends + CPUs', '1', () => { menuStage = 'count'; sfx.click(); }],
      ['HOST', 'Create a room for online friends', '2', () => { menuStage = 'hostcount'; sfx.click(); }],
      ['JOIN', 'Enter a room code', '3', () => { codeInput = ''; netMsg = ''; menuStage = 'join'; sfx.click(); }]];
    opts.forEach(([big, sub, key, act], i) => { if (button(W / 2 - 480 + i * 330, 218, 300, 100, big, sub, key, COLORS[i], act)) any = true; });
    if (netMsg) text(netMsg, W / 2, 346, 14, '#fca5a5', 'center', '800', 'rgba(0,0,0,.6)');
  } else if (menuStage === 'count' || menuStage === 'hostcount') {
    const online = menuStage === 'hostcount';
    text(online ? 'HOW MANY TANKS IN THE ROOM?  (friends take the open seats, CPUs fill the rest)' : 'SELECT FORCE SIZE', W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    [2, 3, 4].forEach((n, i) => { if (button(W / 2 - 300 + i * 205, 218, 190, 96, n + '', n + ' TANKS', n, COLORS[i + 1], () => online ? (sfx.click(), hostRoom(n)) : pickCount(n))) any = true; });
    if (button(W / 2 - 60, 326, 120, 34, '◀', '', 'Esc', '#fff', () => { menuStage = 'home'; sfx.click(); })) any = true;
    if (netMsg) text(netMsg, W / 2, 384, 14, '#fca5a5', 'center', '800', 'rgba(0,0,0,.6)');
  } else {
    text(`${numPlayers} TANKS — HOW MANY HUMANS?`, W / 2, 198, 16, INK, 'center', '800', 'rgba(0,0,0,.6)');
    const opts = Array.from({length: numPlayers + 1}, (_, i) => i), bw = 150, gap = 14, x0 = W / 2 - (opts.length * bw + (opts.length - 1) * gap) / 2;
    opts.forEach((n, i) => {
      const sub = n === 0 ? 'WATCH CPUs' : n === numPlayers ? 'ALL HUMAN' : (numPlayers - n) + ' CPU';
      if (button(x0 + i * (bw + gap), 218, bw, 96, n + '', sub, n, COLORS[i % 4], () => pickHumans(n))) any = true;
    });
    if (button(W / 2 - 60, 326, 120, 34, '◀', '', 'Esc', '#fff', () => { menuStage = 'count'; sfx.click(); })) any = true;
  }
  cv.style.cursor = any ? 'pointer' : 'default';

  // info panels
  panel(60, 392, 470, 200, 16);
  text('FIELD MANUAL', 84, 416, 14, '#d4a417', 'left', '900');
  [['←  →', 'aim the barrel'], ['↑  ↓', 'set power  (hold Shift for fine)'], ['A  D', 'drive (limited fuel)'], ['1  2  3', 'pick weapon'], ['SPACE', 'fire!'], ['T / M / P', 'aim assist / sound / pause']]
    .forEach(([k, d], i) => { const y = 444 + i * 24; rr(84, y - 10, 82, 20, 6); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill(); text(k, 125, y + 1, 12, '#fff', 'center', '800'); text(d, 180, y + 1, 13, 'rgba(255,255,255,.85)', 'left', '600'); });
  panel(550, 392, 510, 200, 16);
  text('HIT AN ENEMY → AUTH CODE → SUPPLY DROP', 574, 416, 14, '#d4a417', 'left', '900');
  SPECIALS.forEach((s, i) => {
    const x = 574 + (i % 2) * 245, y = 447 + Math.floor(i / 2) * 40;
    rr(x, y - 17, 235, 34, 10); ctx.fillStyle = s.color + '33'; ctx.fill(); ctx.strokeStyle = s.color + 'aa'; ctx.lineWidth = 1.5; ctx.stroke();
    text(s.icon, x + 22, y + 1, 20, '#fff', 'center'); text(s.name, x + 42, y - 6, 12, '#fff', 'left', '900'); text(s.desc, x + 42, y + 9, 10.5, 'rgba(255,255,255,.7)', 'left', '600');
  });
  drawParts();
}

// ====================================================== main draw/loop
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'menu') { drawWorld(menuTanks); drawMenu(); return; }
  drawWorld(tanks);
  uiButtons = [];
  drawCards(); drawWind(); drawControlPanel(); drawBanner();
  if (state === 'quick' && qte) drawQuick();
  if (state === 'wheel' && wheel) drawWheel();
  if (state === 'over') drawOver();
  if (paused) {
    ctx.fillStyle = 'rgba(8,10,5,.62)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, H / 2 - 10, 60, '#fff', 'center', '900', 'rgba(0,0,0,.6)');
    text('press P to resume', W / 2, H / 2 + 40, 16, 'rgba(255,255,255,.7)', 'center', '700');
  }
  cv.style.cursor = 'default';
}

function initMenuScene() {
  numPlayers = 4; makeScene();
  menuTanks = [0, 1, 2, 3].map(i => { const t = newTank(i); t.x = 130 + i * 285 + rnd(-30, 30); t.y = ground[Math.floor(t.x)] - 4; t.tilt = tiltAt(t.x); return t; });
  numPlayers = 2;
}

// ====================================================== input
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true; audio();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' ', 'backspace'].includes(k)) e.preventDefault();
  if (mode === 'menu' && menuStage === 'join') {            // typing a room code
    if (k === 'escape') { menuStage = 'home'; netMsg = ''; }
    else if (k === 'enter') joinRoom(codeInput);
    else if (k === 'backspace') codeInput = codeInput.slice(0, -1);
    else if (/^[a-z0-9]$/.test(k) && !e.ctrlKey && !e.metaKey && codeInput.length < 5) codeInput += k.toUpperCase();
    return;
  }
  if (k === 'm') { muted = !muted; return; }
  if (mode === 'menu') {
    const n = parseInt(e.key);
    if (k === 'escape' || k === 'backspace') {
      if (menuStage === 'lobby' || menuStage === 'connecting') leaveRoom();
      else menuStage = menuStage === 'humans' ? 'count' : 'home';
      netMsg = ''; return;
    }
    if (menuStage === 'home') { if (n === 1) menuStage = 'count'; else if (n === 2) menuStage = 'hostcount'; else if (n === 3) { codeInput = ''; netMsg = ''; menuStage = 'join'; } }
    else if (menuStage === 'count') { if (n >= 2 && n <= 4) pickCount(n); }
    else if (menuStage === 'hostcount') { if (n >= 2 && n <= 4) hostRoom(n); }
    else if (menuStage === 'humans') { if (n >= 0 && n <= numPlayers) pickHumans(n); }
    else if (menuStage === 'lobby' && k === 'enter') startOnline();
    return;
  }
  if (k === 'escape') { if (net) leaveRoom(); else { mode = 'menu'; menuStage = 'home'; initMenuScene(); } return; }
  if (k === 'p' && state !== 'over' && !net) { paused = !paused; return; }
  if (k === 't') { assist = !assist; return; }
  if (state === 'over' && k === 'enter' && (!net || net.role === 'host')) { startRound(); return; }
  if (paused || !tanks.length) return;
  const t = tanks[turn];
  if (state === 'quick' && qte && !qte.done) {               // the post-hit W/A/S/D combo
    if ('wasd'.includes(k) && k.length === 1 && !e.repeat && !t.ai && isMine(t)) pressCombo(k);
    return;
  }
  if (state === 'aim' && !t.ai && isMine(t)) {
    if (k === ' ' && !e.repeat) tryFire();
    const n = '123'.indexOf(k);
    if (n >= 0 && k.length === 1 && t.ammo[n] > 0) { t.weapon = n; sfx.click(); }
  }
});
addEventListener('paste', e => {
  if (mode !== 'menu' || menuStage !== 'join') return;
  const s = (e.clipboardData && e.clipboardData.getData('text')) || '';
  const m = s.match(/room=([A-Za-z0-9]{4,6})/) || s.match(/^\s*([A-Za-z0-9]{4,6})\s*$/);
  if (m) codeInput = m[1].toUpperCase().slice(0, 5);
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function toCanvas(e) { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height}; }
const inRect = (p, b) => p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h;
const activePtr = new Map();   // pointer currently dragging a control (power bar / angle dial)
cv.addEventListener('pointerdown', e => {
  audio(); Object.assign(mouse, toCanvas(e));
  if (mode === 'menu') {
    for (const b of menuButtons) if (inRect(mouse, b)) { b.action(); break; }
    return;
  }
  for (const b of uiButtons) if (inRect(mouse, b)) {      // mouse shortcuts on the control panel
    e.preventDefault();
    try { cv.setPointerCapture(e.pointerId); } catch (_) {}
    if (b.drag) { activePtr.set(e.pointerId, b); b.drag(mouse.x, mouse.y); }
    else if (b.tap) b.tap();
    break;
  }
});
cv.addEventListener('pointermove', e => { Object.assign(mouse, toCanvas(e)); const b = activePtr.get(e.pointerId); if (b && b.drag) b.drag(mouse.x, mouse.y); });
const ptrUp = e => activePtr.delete(e.pointerId);
cv.addEventListener('pointerup', ptrUp); cv.addEventListener('pointercancel', ptrUp);
cv.addEventListener('pointerleave', () => { mouse.x = mouse.y = -1; });

initMenuScene();

// Fixed 60 Hz simulation, driven by a Web Worker timer so the host keeps running even when its tab is in the
// background (browsers throttle normal timers/rAF in hidden tabs, which would freeze everyone else's game).
let lastTick = performance.now(), acc = 0;
function tick() {
  const now = performance.now(); acc += Math.min(250, now - lastTick); lastTick = now;
  netTick();
  for (let n = 0; acc >= 1000 / 60 && n < 8; n++, acc -= 1000 / 60) update();
}
try {
  const wk = new Worker(URL.createObjectURL(new Blob(['setInterval(()=>postMessage(0),8)'], {type: 'text/javascript'})));
  wk.onmessage = tick;
} catch (e) { setInterval(tick, 8); }
(function frame() { draw(); requestAnimationFrame(frame); })();

// invite links look like  .../?room=ABCDE
(function () {
  const m = location.search.match(/[?&]room=([A-Za-z0-9]{4,6})/);
  if (m) { codeInput = m[1].toUpperCase().slice(0, 5); setTimeout(() => joinRoom(codeInput), 400); }
})();
