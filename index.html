<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Scorched Tanks</title>
<style>
  html,body{margin:0;height:100%;background:#07080d;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  canvas{width:min(100vw,calc(100vh * 1120 / 630));aspect-ratio:1120/630;display:block;box-shadow:0 0 60px #000}
</style>
</head>
<body>
<canvas id="c" width="1120" height="630"></canvas>
<script>
'use strict';
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const W = cv.width, H = cv.height, TAU = Math.PI * 2;
const G = 0.12, POWER_SCALE = 0.1, WIND_SCALE = 0.004;
const GROUND_MIN = 200, GROUND_MAX = H - 160;

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const pick = a => a[Math.floor(Math.random() * a.length)];

// ====================================================== data
const WEAPONS = [
  {name:'Missile',  icon:'🚀', color:'#ffd966', radius:32, damage:45, shots:1, ammo:Infinity},
  {name:'Big Bomb', icon:'💣', color:'#ff8a5c', radius:60, damage:75, shots:1, ammo:3},
  {name:'Triple',   icon:'☄️', color:'#8be9fd', radius:24, damage:35, shots:3, ammo:3},
];
// Prize-wheel specials: one use, applied to the winner's next attack
const SPECIALS = [
  {name:'NUKE',      icon:'☢️', color:'#ef4444', desc:'Massive blast',          radius:115, damage:100, shots:1, kind:'nuke'},
  {name:'MIRV',      icon:'🎆', color:'#f59e0b', desc:'Splits into 5 warheads', radius:30,  damage:40,  shots:1, kind:'mirv'},
  {name:'DIRT BOMB', icon:'🪨', color:'#b4733a', desc:'Buries with dirt',       radius:55,  damage:0,   shots:1, kind:'dirt'},
  {name:'BOUNCER',   icon:'🏀', color:'#22c55e', desc:'Bounces 3 times',        radius:35,  damage:45,  shots:1, kind:'bounce'},
  {name:'AIRSTRIKE', icon:'✈️', color:'#3b82f6', desc:'6 bombs rain down',      radius:30,  damage:40,  shots:1, kind:'air'},
  {name:'TELEPORT',  icon:'🌀', color:'#14b8a6', desc:'Warps you to where it lands', radius:0, damage:0, shots:1, kind:'teleport'},
  {name:'VAMPIRE',   icon:'🧛', color:'#a855f7', desc:'Heals you by damage dealt', radius:40, damage:55, shots:1, kind:'vamp'},
];
const CHILD = {name:'Child', color:'#ffd0a0', radius:26, damage:35, shots:1, kind:'child'};
const COLORS = ['#4ade80', '#f87171', '#60a5fa', '#facc15'];

const THEMES = [
  {name:'Day', sky:['#3f94f2', '#9ad4ff', '#ffe8b5'], sun:{x:.78, y:.2, r:30, c:'#fffbe0', glow:'rgba(255,244,190,.85)'}, stars:0,
   cloud:'#ffffff', mtn:['#7da2c9', '#587fa6'], top:'#4f9a22', grass:'#86d63e', dirt:['#a8702f', '#6e4219', '#3b220b']},
  {name:'Sunset', sky:['#2a1458', '#b8325a', '#ffb347'], sun:{x:.22, y:.5, r:44, c:'#ffe3a0', glow:'rgba(255,170,90,.9)'}, stars:40,
   cloud:'#ff9bb0', mtn:['#73305e', '#431a48'], top:'#6a8f27', grass:'#b2d848', dirt:['#9a5c2e', '#63361a', '#34190b']},
  {name:'Night', sky:['#040913', '#101f48', '#2b3d78'], sun:{x:.8, y:.2, r:26, c:'#f4f6ff', glow:'rgba(170,190,255,.7)'}, stars:150, moon:true,
   cloud:'#3c4d84', mtn:['#1a2a55', '#0f1a39'], top:'#2c8a57', grass:'#4fd18b', dirt:['#5b4b66', '#3a2f46', '#1d1727']},
  {name:'Desert', sky:['#ff8c5a', '#ffc984', '#fff1c9'], sun:{x:.7, y:.26, r:36, c:'#fff4d0', glow:'rgba(255,230,160,.9)'}, stars:0,
   cloud:'#ffe9cc', mtn:['#c98458', '#9c5e3b'], top:'#c99b44', grass:'#efc86a', dirt:['#cf9253', '#92602e', '#5b3716']},
];

// ====================================================== state
let ground, tanks = [], shots = [], parts = [], rings = [], flashes = [], popups = [], scorches = [];
let pending = [], hit = [false, false, false, false];
let wind = 0, turn = 0, state = 'aim', wins = [0, 0, 0, 0], winner = -1;
let theme = THEMES[0], bgCanvas, texCanvas, clouds = [], stars = [], streaks = [], menuTanks = [];
let numPlayers = 2, numHumans = 1, menuStage = 'count';
let mode = 'menu', paused = false, assist = true, muted = false;
let shake = 0, whiteFlash = 0, T = 0, aiTimer = 0, aiPlan = null;
let banner = null, wheel = null, menuButtons = [];
const keys = {}, mouse = {x: -1, y: -1};

// ====================================================== audio (tiny synth)
let AC = null;
function audio() {
  if (!AC) { try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} }
  if (AC && AC.state === 'suspended') AC.resume();
  return AC;
}
function tone(f0, f1, dur, type = 'sine', vol = .15, delay = 0) {
  const a = audio(); if (!a || muted) return;
  const t = a.currentTime + delay, o = a.createOscillator(), g = a.createGain();
  o.type = type; o.frequency.setValueAtTime(f0, t); o.frequency.exponentialRampToValueAtTime(Math.max(20, f1), t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  o.connect(g).connect(a.destination); o.start(t); o.stop(t + dur + .02);
}
function noise(dur, vol, f0, f1) {
  const a = audio(); if (!a || muted) return;
  const n = Math.floor(a.sampleRate * dur), buf = a.createBuffer(1, n, a.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < n; i++) d[i] = Math.random() * 2 - 1;
  const s = a.createBufferSource(), fl = a.createBiquadFilter(), g = a.createGain(), t = a.currentTime;
  s.buffer = buf; fl.type = 'lowpass'; fl.frequency.setValueAtTime(f0, t); fl.frequency.exponentialRampToValueAtTime(f1, t + dur);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
  s.connect(fl).connect(g).connect(a.destination); s.start(t);
}
const sfx = {
  fire:   () => { noise(.25, .3, 2500, 300); tone(160, 45, .25, 'triangle', .25); },
  boom:   r => { noise(.5 + r / 120, .55, 1800, 80); tone(90, 30, .5 + r / 150, 'sine', .45); },
  tick:   () => tone(900, 700, .04, 'square', .05),
  hit:    () => { tone(660, 990, .12, 'triangle', .12); },
  win:    () => [523, 659, 784, 1047].forEach((f, i) => tone(f, f, .25, 'triangle', .16, i * .1)),
  prize:  () => [784, 988, 1175, 1568].forEach((f, i) => tone(f, f, .3, 'square', .08, i * .08)),
  click:  () => tone(500, 650, .06, 'square', .06),
};

// ====================================================== helpers (drawing)
function rr(x, y, w, h, r) {
  ctx.beginPath(); ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
  ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
}
function text(s, x, y, size, color, align = 'left', weight = '600', outline) {
  ctx.font = `${weight} ${size}px "Segoe UI", system-ui, sans-serif`;
  ctx.textAlign = align; ctx.textBaseline = 'middle';
  if (outline) { ctx.lineWidth = Math.max(3, size / 6); ctx.strokeStyle = outline; ctx.lineJoin = 'round'; ctx.strokeText(s, x, y); }
  ctx.fillStyle = color; ctx.fillText(s, x, y);
}
function shade(hex, f) {
  const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => Math.round(f >= 0 ? v + (255 - v) * f : v * (1 + f)));
  return `rgb(${c[0]},${c[1]},${c[2]})`;
}
function glow(color, blur) { ctx.shadowColor = color; ctx.shadowBlur = blur; }
function noGlow() { ctx.shadowBlur = 0; ctx.shadowColor = 'transparent'; }
function panel(x, y, w, h, r = 14, border = 'rgba(255,255,255,.14)', bw = 1.5) {
  rr(x, y, w, h, r);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, 'rgba(24,28,48,.86)'); g.addColorStop(1, 'rgba(8,10,20,.86)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = border; ctx.lineWidth = bw; ctx.stroke();
}

// ====================================================== scene generation
function makeTerrain() {
  ground = new Float32Array(W);
  const waves = [];
  for (let i = 0; i < 4; i++) waves.push({a: rnd(25, 75) / (i + 1), f: rnd(0.004, 0.012) * (i + 1), p: rnd(0, TAU)});
  for (let x = 0; x < W; x++) {
    let y = H * 0.55;
    for (const w of waves) y += Math.sin(x * w.f + w.p) * w.a;
    ground[x] = clamp(y, GROUND_MIN, GROUND_MAX);
  }
}

function renderBG() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  const sk = g.createLinearGradient(0, 0, 0, H * .85);
  theme.sky.forEach((col, i) => sk.addColorStop(i / (theme.sky.length - 1), col));
  g.fillStyle = sk; g.fillRect(0, 0, W, H);
  const s = theme.sun, sx = s.x * W, sy = s.y * H;
  const gl = g.createRadialGradient(sx, sy, 0, sx, sy, s.r * 6);
  gl.addColorStop(0, s.glow); gl.addColorStop(1, 'rgba(255,255,255,0)');
  g.fillStyle = gl; g.fillRect(0, 0, W, H);
  g.fillStyle = s.c; g.beginPath(); g.arc(sx, sy, s.r, 0, TAU); g.fill();
  if (theme.moon) { g.fillStyle = 'rgba(120,130,170,.35)'; for (let i = 0; i < 6; i++) { g.beginPath(); g.arc(sx + rnd(-s.r * .6, s.r * .6), sy + rnd(-s.r * .6, s.r * .6), rnd(2, 6), 0, TAU); g.fill(); } }
  theme.mtn.forEach((col, li) => {
    const base = H * (.56 + li * .07), amp = 130 - li * 30, p1 = rnd(0, 9), p2 = rnd(0, 9);
    g.fillStyle = col; g.beginPath(); g.moveTo(0, H);
    for (let x = 0; x <= W + 8; x += 8) g.lineTo(x, base - amp * (Math.abs(Math.sin(x * .005 * (li + 1) + p1)) * .7 + Math.abs(Math.sin(x * .014 + p2)) * .3));
    g.lineTo(W, H); g.fill();
  });
  const haze = g.createLinearGradient(0, H * .5, 0, H * .85);
  haze.addColorStop(0, 'rgba(255,255,255,0)'); haze.addColorStop(1, 'rgba(255,255,255,.12)');
  g.fillStyle = haze; g.fillRect(0, H * .5, W, H * .4);
  return c;
}

function renderTex() {
  const c = document.createElement('canvas'); c.width = W; c.height = H;
  const g = c.getContext('2d');
  for (let i = 0; i < 9000; i++) { g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.10)' : 'rgba(255,255,255,.06)'; g.fillRect(rnd(0, W), rnd(0, H), rnd(1, 3), rnd(1, 3)); }
  for (let i = 0; i < 90; i++) {
    g.fillStyle = Math.random() < .5 ? 'rgba(0,0,0,.14)' : 'rgba(255,255,255,.08)';
    g.beginPath(); g.ellipse(rnd(0, W), rnd(GROUND_MIN, H), rnd(3, 9), rnd(2, 5), rnd(0, 3), 0, TAU); g.fill();
  }
  return c;
}

function makeScene() {
  theme = pick(THEMES);
  makeTerrain();
  bgCanvas = renderBG();
  if (!texCanvas) texCanvas = renderTex();
  scorches = [];
  clouds = Array.from({length: 7}, () => ({x: rnd(0, W), y: rnd(70, 260), s: rnd(.7, 1.6), v: rnd(.05, .18)}));
  stars = Array.from({length: theme.stars}, () => ({x: rnd(0, W), y: rnd(0, H * .55), r: rnd(.5, 1.7), ph: rnd(0, 9)}));
  streaks = Array.from({length: 46}, () => ({x: rnd(0, W), y: rnd(80, H - 160), l: rnd(14, 34), s: rnd(.6, 1.4)}));
}

// ====================================================== tanks & turns
function tiltAt(x) {
  const i0 = clamp(Math.floor(x - 11), 0, W - 1), i1 = clamp(Math.floor(x + 11), 0, W - 1);
  return Math.atan2(ground[i1] - ground[i0], Math.max(1, i1 - i0));
}
function newTank(i) {
  const slot = W / numPlayers, x = slot * i + rnd(slot * 0.25, slot * 0.75);
  return {i, x, y: ground[Math.floor(x)] - 4, hp: 100, shownHp: 100, angle: x < W / 2 ? 55 : 125, power: 55, weapon: 0,
          ammo: WEAPONS.map(w => w.ammo), fuel: 60, color: COLORS[i], vy: 0, special: null, ai: i >= numHumans,
          tilt: tiltAt(x), recoil: 0, dead: false};
}
function startRound() {
  makeScene();
  tanks = Array.from({length: numPlayers}, (_, i) => newTank(i));
  shots = []; parts = []; rings = []; flashes = []; popups = []; pending = []; wheel = null; winner = -1;
  hit = [false, false, false, false]; shake = 0; whiteFlash = 0; paused = false;
  beginTurn(Math.floor(Math.random() * numPlayers));
  mode = 'play';
}
function nextAlive(from) {
  for (let k = 1; k <= numPlayers; k++) { const n = (from + k) % numPlayers; if (tanks[n].hp > 0) return n; }
  return from;
}
function beginTurn(t) {
  turn = t; state = 'aim'; wind = Math.round(rnd(-10, 10));
  tanks[t].fuel = 60; aiPlan = null; aiTimer = 80;
  banner = {t: 0, text: `PLAYER ${t + 1}'S TURN`, sub: tanks[t].ai ? 'CPU' : 'YOUR SHOT', color: tanks[t].color};
}
function pivot(t) {   // world position of the turret pivot, accounting for hull tilt
  return {x: t.x + 19 * Math.sin(t.tilt), y: t.y + 4 - 19 * Math.cos(t.tilt)};
}
function muzzle(t) {
  const p = pivot(t), a = t.angle * Math.PI / 180;
  return {x: p.x + Math.cos(a) * 26, y: p.y - Math.sin(a) * 26};
}

// ====================================================== effects
function addP(o) { parts.push(Object.assign({life: 30, max: 0, g: 0, drag: 1, size: 3, type: 'spark', vx: 0, vy: 0, rot: rnd(0, TAU), vr: rnd(-.3, .3)}, o)); const p = parts[parts.length - 1]; p.max = p.life; }
function burst(x, y, n, o) {
  for (let i = 0; i < n; i++) { const a = rnd(0, TAU), s = rnd(o.s0, o.s1); addP(Object.assign({}, o, {x, y, vx: Math.cos(a) * s, vy: Math.sin(a) * s + (o.up || 0), life: rnd(o.l0, o.l1), size: rnd(o.z0, o.z1)})); }
}
function confetti(x, y, n, spread = 6) {
  for (let i = 0; i < n; i++) addP({type: 'confetti', x, y, vx: rnd(-spread, spread), vy: rnd(-spread * 1.3, -1), g: .13, drag: .985, life: rnd(90, 170), size: rnd(4, 8), color: pick(['#facc15', '#f87171', '#4ade80', '#60a5fa', '#c084fc', '#fff'])});
}
function explosionFx(x, y, r, color) {
  flashes.push({x, y, r: r * 1.9, life: 10, max: 10});
  rings.push({x, y, r0: r * .3, r1: r * 2.2, life: 24, max: 24, color: 'rgba(255,230,170,1)', w: 4});
  rings.push({x, y, r0: r * .2, r1: r * 1.5, life: 18, max: 18, color: 'rgba(255,255,255,1)', w: 2});
  burst(x, y, r * 1.4, {type: 'fire', s0: .6, s1: 2.2 + r / 22, l0: 20, l1: 42, z0: 4, z1: 9, drag: .94, g: -.012});
  burst(x, y, r * .55, {type: 'spark', s0: 2, s1: 7 + r / 18, l0: 30, l1: 60, z0: 1, z1: 2, drag: .985, g: .1});
  burst(x, y, r / 4 + 3, {type: 'smoke', s0: .3, s1: 1.6, l0: 60, l1: 110, z0: 7, z1: 13, drag: .975, g: -.025, up: -.4});
  for (let i = 0; i < r * .55; i++) addP({type: 'dirt', x: x + rnd(-r * .5, r * .5), y, vx: rnd(-3, 3), vy: -rnd(1, 5.5), g: .13, life: rnd(40, 80), size: rnd(2, 4.5), color: pick(theme.dirt)});
  shake = Math.max(shake, Math.min(22, r / 5));
  if (r > 100) whiteFlash = .85;
  sfx.boom(r);
}
function popup(x, y, s, color, size = 22) { popups.push({x, y, s, color, size, life: 55, max: 55}); }

function updateFx() {
  T++;
  for (const p of parts) {
    p.vx *= p.drag; p.vy = p.vy * p.drag + p.g; p.x += p.vx; p.y += p.vy; p.life--; p.rot += p.vr;
    if (p.type === 'dirt' && p.y >= ground[clamp(Math.floor(p.x), 0, W - 1)] && p.vy > 0) p.life = Math.min(p.life, 6);
  }
  parts = parts.filter(p => p.life > 0 && p.y < H + 40);
  if (parts.length > 1800) parts.splice(0, parts.length - 1800);
  for (const r of rings) r.life--; rings = rings.filter(r => r.life > 0);
  for (const f of flashes) f.life--; flashes = flashes.filter(f => f.life > 0);
  for (const p of popups) { p.y -= .7; p.life--; } popups = popups.filter(p => p.life > 0);
  shake *= .9; if (shake < .15) shake = 0; whiteFlash *= .9;
  const wv = mode === 'menu' ? 3 : wind;
  for (const c of clouds) { c.x += c.v + wv * .03; if (c.x > W + 120) c.x = -140; if (c.x < -140) c.x = W + 120; }
  for (const s of streaks) { s.x += wv * .55 * s.s; if (s.x > W + 40) s.x = -40; if (s.x < -40) s.x = W + 40; }
  if (banner && ++banner.t > 110) banner = null;
}

// ====================================================== firing & damage
function crater(cx, cy, r) {
  for (let x = Math.max(0, Math.floor(cx - r)); x <= Math.min(W - 1, Math.ceil(cx + r)); x++) {
    const dx = x - cx, dy = Math.sqrt(r * r - dx * dx);
    if (ground[x] >= cy - dy && ground[x] <= cy + dy) ground[x] = Math.min(H, cy + dy);
  }
}
function fire() {
  const t = tanks[turn];
  let w = t.special;
  if (w) t.special = null;
  else { w = WEAPONS[t.weapon]; if (t.ammo[t.weapon] <= 0) return; t.ammo[t.weapon]--; }
  hit = [false, false, false, false];
  const m = muzzle(t), v = t.power * POWER_SCALE;
  for (let k = 0; k < w.shots; k++) {
    const a = (t.angle + (k - (w.shots - 1) / 2) * 7) * Math.PI / 180;
    shots.push({x: m.x, y: m.y, vx: Math.cos(a) * v, vy: -Math.sin(a) * v, w, owner: turn, trail: [],
                bounces: w.kind === 'bounce' ? 3 : 0, split: w.kind === 'mirv'});
  }
  t.recoil = 8; shake = Math.max(shake, 3);
  burst(m.x, m.y, 10, {type: 'fire', s0: .5, s1: 3, l0: 8, l1: 16, z0: 3, z1: 6, drag: .9});
  burst(m.x, m.y, 8, {type: 'smoke', s0: .2, s1: 1, l0: 30, l1: 50, z0: 4, z1: 7, drag: .96, g: -.02});
  sfx.fire();
  state = 'fly';
}

function explode(x, y, w, owner) {
  if (w.kind === 'dirt') {
    for (let px = Math.max(0, Math.floor(x - w.radius)); px <= Math.min(W - 1, Math.ceil(x + w.radius)); px++) {
      const dy = Math.sqrt(Math.max(0, w.radius * w.radius - (px - x) ** 2));
      if (ground[px] > y - dy) ground[px] = Math.max(60, y - dy);
    }
    for (let i = 0; i < 50; i++) addP({type: 'dirt', x: x + rnd(-w.radius, w.radius), y: y - rnd(0, w.radius), vx: rnd(-1.5, 1.5), vy: rnd(-3, 0), g: .1, life: rnd(30, 60), size: rnd(2, 5), color: pick(theme.dirt)});
    rings.push({x, y, r0: 8, r1: w.radius * 1.5, life: 20, max: 20, color: 'rgba(210,160,90,1)', w: 3});
    shake = Math.max(shake, 4); sfx.boom(20);
    return;
  }
  if (w.kind === 'teleport') {
    const t = tanks[owner], nx = clamp(x, 16, W - 16);
    const warp = (px, py) => {
      rings.push({x: px, y: py, r0: 6, r1: 46, life: 22, max: 22, color: 'rgba(94,234,212,1)', w: 3});
      rings.push({x: px, y: py, r0: 2, r1: 28, life: 16, max: 16, color: 'rgba(255,255,255,1)', w: 2});
      burst(px, py, 28, {type: 'spark', s0: 1, s1: 4, l0: 20, l1: 40, z0: 1.5, z1: 2.5, drag: .96, g: -.02, up: -1});
    };
    warp(t.x, t.y - 8);
    t.x = nx; t.y = ground[Math.floor(nx)] - 4; t.vy = 0; t.tilt = tiltAt(nx);
    warp(t.x, t.y - 8);
    popup(t.x, t.y - 56, 'WARP!', '#5eead4', 22);
    sfx.prize();
    return;
  }
  if (w.kind === 'air') {
    for (let i = 0; i < 6; i++) pending.push({x: x + (i - 2.5) * 38, y: -20 - i * 25, vx: 0, vy: 3, w: CHILD, owner, trail: [], bounces: 0});
  }
  crater(x, y, w.radius);
  scorches.push({x, y, r: w.radius * 1.5}); if (scorches.length > 40) scorches.shift();
  explosionFx(x, y, w.radius, w.color);
  let dealt = 0;
  for (const t of tanks) {
    const d = Math.hypot(t.x - x, t.y - 8 - y);
    if (t.hp > 0 && d < w.radius + 14) {
      const dmg = Math.round(w.damage * (1 - Math.max(0, d - 14) / w.radius));
      if (dmg <= 0) continue;
      t.hp -= dmg; popup(t.x, t.y - 56, '-' + dmg, '#ff6b5e', 22 + dmg / 8);
      if (t.i !== owner) { hit[owner] = true; dealt += dmg; sfx.hit(); }
    }
  }
  if (w.kind === 'vamp' && dealt) {
    const o = tanks[owner]; o.hp = Math.min(100, o.hp + dealt);
    popup(o.x, o.y - 56, '+' + dealt, '#a3e635', 22);
  }
}

function simulate(sx, sy, angle, power, windv, collect) {
  const a = angle * Math.PI / 180, v = power * POWER_SCALE;
  let x = sx, y = sy, vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let i = 0; i < 2000; i++) {
    vx += windv * WIND_SCALE; vy += G; x += vx; y += vy;
    if (collect && i < collect && i % 3 === 0) collect.pts.push([x, y]);
    if (x < 0 || x >= W) return {x, y, out: true};
    if (y >= ground[Math.floor(x)]) return {x, y};
  }
  return {x, y};
}
function previewPoints(t) {
  const m = muzzle(t), a = t.angle * Math.PI / 180, v = t.power * POWER_SCALE, pts = [];
  let x = m.x, y = m.y, vx = Math.cos(a) * v, vy = -Math.sin(a) * v;
  for (let i = 0; i < 66; i++) {
    vx += wind * WIND_SCALE; vy += G; x += vx; y += vy;
    if (x < 0 || x >= W || y >= ground[Math.floor(x)]) break;
    if (i % 4 === 3) pts.push([x, y]);
  }
  return pts;
}

function aiThink(t) {
  const targets = tanks.filter(o => o.i !== t.i && o.hp > 0);
  if (!targets.length) return fire();
  let best = null;
  const m = muzzle(t);
  for (let a = 20; a <= 160; a += 2) for (let p = 20; p <= 100; p += 2) {
    const r = simulate(m.x, m.y, a, p, wind);
    if (r.out) continue;
    const d = Math.min(...targets.map(o => Math.hypot(r.x - o.x, r.y - o.y)));
    if (!best || d < best.d) best = {a, p, d};
  }
  if (!best) best = {a: 90, p: 50, d: 999};
  const err = 5;
  aiPlan = {a: best.a + rnd(-err, err), p: clamp(best.p + rnd(-err, err), 20, 100), weapon: 0};
  if (t.ammo[1] > 0 && best.d < 40 && Math.random() < .6) aiPlan.weapon = 1;
  else if (t.ammo[2] > 0 && Math.random() < .3) aiPlan.weapon = 2;
  t.weapon = aiPlan.weapon;
}

// ====================================================== update
function update() {
  updateFx();
  if (mode === 'menu') {
    for (const t of menuTanks) { t.angle = 90 + Math.sin(T * .02 + t.i * 1.7) * 55; t.recoil *= .85; }
    return;
  }
  if (paused) return;

  for (const t of tanks) {
    t.shownHp += (Math.max(0, t.hp) - t.shownHp) * .12;
    t.recoil *= .84;
    t.tilt = lerp(t.tilt, tiltAt(t.x), .2);
    const gy = ground[clamp(Math.floor(t.x), 0, W - 1)] - 4;
    if (t.y < gy) {
      t.vy += G; t.y = Math.min(gy, t.y + t.vy);
      if (t.y >= gy) {
        if (t.vy > 4 && t.hp > 0) { const d = Math.round((t.vy - 4) * 6); t.hp -= d; popup(t.x, t.y - 50, '-' + d, '#ffb347', 18); }
        t.vy = 0;
      }
    } else { t.y = gy; t.vy = 0; }
    if (t.hp <= 0 && !t.dead) {
      t.dead = true; t.hp = 0;
      explosionFx(t.x, t.y - 8, 42, t.color);
      popup(t.x, t.y - 60, 'DESTROYED', '#fff', 20);
    }
    if (t.dead && T % 5 === 0) addP({type: 'smoke', x: t.x + rnd(-8, 8), y: t.y - 10, vx: rnd(-.2, .2), vy: -rnd(.5, 1.2), g: -.01, life: rnd(50, 90), size: rnd(5, 9), drag: .98});
    else if (!t.dead && t.hp < 35 && T % 9 === 0) addP({type: 'smoke', x: t.x + rnd(-8, 8), y: t.y - 12, vx: rnd(-.2, .2), vy: -rnd(.4, 1), g: -.01, life: rnd(40, 70), size: rnd(3, 6), drag: .98});
  }

  if (state === 'aim') {
    const t = tanks[turn];
    if (t.ai) {
      if (--aiTimer <= 0) {
        if (!aiPlan) { aiThink(t); aiTimer = 30; }
        else if (aiPlan) {
          t.angle += Math.sign(aiPlan.a - t.angle) * Math.min(2, Math.abs(aiPlan.a - t.angle));
          t.power += Math.sign(aiPlan.p - t.power) * Math.min(1.5, Math.abs(aiPlan.p - t.power));
          if (Math.abs(aiPlan.a - t.angle) < .1 && Math.abs(aiPlan.p - t.power) < .1) fire();
        }
      }
    } else {
      const fine = keys['shift'] ? 0.2 : 1;
      if (keys['arrowleft'])  t.angle = Math.min(180, t.angle + fine);
      if (keys['arrowright']) t.angle = Math.max(0, t.angle - fine);
      if (keys['arrowup'])    t.power = Math.min(100, t.power + fine * 0.6);
      if (keys['arrowdown'])  t.power = Math.max(5, t.power - fine * 0.6);
      const dir = (keys['d'] ? 1 : 0) - (keys['a'] ? 1 : 0);
      if (dir && t.fuel > 0) {
        const nx = clamp(t.x + dir * 0.8, 14, W - 14);
        if (Math.abs(ground[Math.floor(nx)] - ground[Math.floor(t.x)]) < 2.5) {
          t.x = nx; t.fuel -= 0.5;
          if (T % 4 === 0) addP({type: 'smoke', x: t.x - dir * 14, y: t.y + 3, vx: -dir * .4, vy: -.3, g: -.005, life: 25, size: 3, drag: .95});
        }
      }
    }
  }

  if (state === 'fly') {
    for (const s of shots) {
      s.vx += wind * WIND_SCALE; s.vy += G; s.x += s.vx; s.y += s.vy;
      s.trail.push([s.x, s.y]); if (s.trail.length > 36) s.trail.shift();
      if (T % 2 === 0) addP({type: 'smoke', x: s.x, y: s.y, vx: rnd(-.1, .1), vy: rnd(-.1, .1), life: 26, size: 2.5, drag: .98});
      if (s.split && s.vy > 0) {   // MIRV splits at the top of its arc
        s.dead = true;
        rings.push({x: s.x, y: s.y, r0: 4, r1: 30, life: 14, max: 14, color: 'rgba(255,200,80,1)', w: 2});
        for (let k = -2; k <= 2; k++) pending.push({x: s.x, y: s.y, vx: s.vx + k * 0.9, vy: s.vy, w: CHILD, owner: s.owner, trail: [], bounces: 0});
        continue;
      }
      const onGround = s.x >= 0 && s.x < W && s.y >= 0 && s.y >= ground[Math.floor(s.x)];
      let boom = s.x < 0 || s.x >= W || s.y >= H;
      if (onGround && s.bounces > 0) {
        s.bounces--; s.y = ground[Math.floor(s.x)] - 2; s.vy *= -0.7; s.vx *= 0.9;
        explode(s.x, s.y, {radius: 14, damage: 15, kind: 'child', color: s.w.color}, s.owner);
        continue;
      }
      if (onGround) boom = true;
      if (!boom && s.w.kind !== 'teleport') for (const t of tanks) if (t.hp > 0 && Math.hypot(s.x - t.x, s.y - (t.y - 8)) < 13) boom = true;
      if (boom) { s.dead = true; if (s.x >= 0 && s.x < W) explode(s.x, Math.min(s.y, H), s.w, s.owner); }
    }
    shots = shots.filter(s => !s.dead).concat(pending); pending = [];
    if (!shots.length) { state = 'settle'; aiTimer = 45; }
  }

  if (state === 'wheel') {
    const prev = wheel.t++;
    const step = TAU / SPECIALS.length, slice = R => Math.floor((((-R) % TAU) + TAU) % TAU / step);
    const R0 = wheelAngle(prev), R1 = wheelAngle(wheel.t);
    if (slice(R0) !== slice(R1) && wheel.t < wheel.spin) { sfx.tick(); wheel.flick = 1; }
    wheel.flick *= .85;
    if (wheel.t === wheel.spin) {
      tanks[turn].special = SPECIALS[wheel.idx];
      confetti(W / 2, H / 2, 90, 7); sfx.prize();
    }
    if (wheel.t > wheel.spin + 130) { wheel = null; beginTurn(nextAlive(turn)); }
  }

  if (state === 'settle' && --aiTimer <= 0) {
    const falling = tanks.some(t => t.hp > 0 && (t.vy > 0 || t.y < ground[clamp(Math.floor(t.x), 0, W - 1)] - 4.5));
    if (!falling) {
      const alive = tanks.filter(t => t.hp > 0);
      if (alive.length <= 1) {
        state = 'over';
        winner = alive.length ? alive[0].i : -1;
        if (winner >= 0) { wins[winner]++; confetti(W / 2, H * .3, 140, 8); sfx.win(); }
      } else if (hit[turn] && tanks[turn].hp > 0) {
        hit = [false, false, false, false];
        wheel = {t: 0, spin: 210, idx: Math.floor(Math.random() * SPECIALS.length), flick: 0};
        state = 'wheel';
      } else beginTurn(nextAlive(turn));
    }
  }
  if (state === 'over' && T % 6 === 0 && winner >= 0) confetti(rnd(0, W), -10, 3, 2);
}
function wheelAngle(t) {
  const step = TAU / SPECIALS.length, p = Math.min(1, t / wheel.spin);
  return (TAU * 6 - (wheel.idx + .5) * step) * (1 - Math.pow(1 - p, 4));
}

// ====================================================== drawing: world
function drawTerrain() {
  ctx.save();
  ctx.beginPath(); ctx.moveTo(0, H);
  for (let x = 0; x < W; x++) ctx.lineTo(x + .5, ground[x]);
  ctx.lineTo(W, H); ctx.closePath();
  const g = ctx.createLinearGradient(0, GROUND_MIN - 40, 0, H);
  g.addColorStop(0, theme.dirt[0]); g.addColorStop(.45, theme.dirt[1]); g.addColorStop(1, theme.dirt[2]);
  ctx.fillStyle = g; ctx.fill(); ctx.clip();
  ctx.drawImage(texCanvas, 0, 0);
  for (const s of scorches) {
    const sg = ctx.createRadialGradient(s.x, s.y, s.r * .2, s.x, s.y, s.r);
    sg.addColorStop(0, 'rgba(0,0,0,.55)'); sg.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = sg; ctx.fillRect(s.x - s.r, s.y - s.r, s.r * 2, s.r * 2);
  }
  ctx.restore();
  const top = () => { ctx.beginPath(); for (let x = 0; x < W; x++) x ? ctx.lineTo(x + .5, ground[x]) : ctx.moveTo(.5, ground[x]); };
  ctx.lineJoin = 'round'; ctx.lineCap = 'round';
  ctx.save(); ctx.translate(0, 6); top(); ctx.strokeStyle = 'rgba(0,0,0,.22)'; ctx.lineWidth = 9; ctx.stroke(); ctx.restore();
  top(); ctx.strokeStyle = theme.top; ctx.lineWidth = 6; ctx.stroke();
  ctx.save(); ctx.translate(0, -1.5); top(); ctx.strokeStyle = theme.grass; ctx.lineWidth = 2.6; ctx.stroke(); ctx.restore();
}

function drawBackdrop() {
  ctx.drawImage(bgCanvas, 0, 0);
  for (const s of stars) { ctx.globalAlpha = .45 + .55 * Math.sin(T * .05 + s.ph); ctx.fillStyle = '#fff'; ctx.fillRect(s.x, s.y, s.r, s.r); }
  ctx.globalAlpha = .6; ctx.fillStyle = theme.cloud;
  for (const c of clouds) for (const [dx, dy, k] of [[0, 0, 1], [.9, -.35, 1.25], [1.9, 0, .95], [.45, .25, .8], [1.45, .3, .85]]) {
    ctx.beginPath(); ctx.arc(c.x + dx * 24 * c.s, c.y + dy * 14 * c.s, 19 * c.s * k, 0, TAU); ctx.fill();
  }
  ctx.globalAlpha = 1;
}

function drawWindStreaks() {
  const w = mode === 'menu' ? 3 : wind;
  if (!w) return;
  ctx.strokeStyle = 'rgba(255,255,255,.22)'; ctx.lineWidth = 1.2; ctx.beginPath();
  for (const s of streaks) { const l = s.l * Math.min(1, Math.abs(w) / 5 + .25) * Math.sign(w); ctx.moveTo(s.x, s.y); ctx.lineTo(s.x - l, s.y); }
  ctx.stroke();
}

function drawTank(t, active) {
  const dead = t.hp <= 0, col = dead ? '#3a3a40' : t.color;
  ctx.save(); ctx.translate(t.x, t.y + 4);
  ctx.fillStyle = 'rgba(0,0,0,.28)'; ctx.beginPath(); ctx.ellipse(0, 1, 22, 3.5, 0, 0, TAU); ctx.fill();
  ctx.rotate(t.tilt);
  // treads
  rr(-19, -10, 38, 10, 5); ctx.fillStyle = dead ? '#1a1a1e' : '#1d1e26'; ctx.fill();
  ctx.fillStyle = '#4a4d5a';
  for (let x = -13; x <= 13; x += 6.5) { ctx.beginPath(); ctx.arc(x, -5, 3.4, 0, TAU); ctx.fill(); }
  ctx.fillStyle = '#7b7f90';
  for (let x = -13; x <= 13; x += 6.5) { ctx.beginPath(); ctx.arc(x, -5, 1.2, 0, TAU); ctx.fill(); }
  // hull
  const hg = ctx.createLinearGradient(0, -19, 0, -9);
  hg.addColorStop(0, shade(col, .35)); hg.addColorStop(1, shade(col, -.3));
  rr(-16, -19, 32, 10, 3.5); ctx.fillStyle = hg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.lineWidth = 1; ctx.stroke();
  ctx.fillStyle = 'rgba(255,255,255,.25)'; ctx.fillRect(-13, -17.5, 26, 1.5);
  // barrel
  ctx.save();
  ctx.translate(0, -19); ctx.rotate(-t.tilt);
  ctx.rotate(dead ? Math.PI * .2 : -t.angle * Math.PI / 180);
  const bg = ctx.createLinearGradient(0, -3, 0, 3); bg.addColorStop(0, '#e9ecf4'); bg.addColorStop(1, '#8a8fa0');
  ctx.fillStyle = bg; ctx.fillRect(-t.recoil, -2.8, 24, 5.6);
  ctx.fillStyle = shade(col, -.25); ctx.fillRect(19 - t.recoil, -3.8, 6, 7.6);
  ctx.restore();
  // dome
  const dg = ctx.createRadialGradient(-3, -24, 1, 0, -20, 12);
  dg.addColorStop(0, shade(col, .55)); dg.addColorStop(1, shade(col, -.25));
  ctx.beginPath(); ctx.ellipse(0, -19, 11, 9, 0, Math.PI, 0); ctx.closePath(); ctx.fillStyle = dg; ctx.fill();
  ctx.strokeStyle = 'rgba(0,0,0,.35)'; ctx.stroke();
  ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.beginPath(); ctx.arc(2, -23, 2.4, 0, TAU); ctx.fill();
  ctx.restore();
  if (dead) return;
  // tag above tank
  text('P' + (t.i + 1), t.x, t.y - 42, 12, '#fff', 'center', '800', 'rgba(0,0,0,.7)');
  rr(t.x - 18, t.y - 35, 36, 6, 3); ctx.fillStyle = 'rgba(0,0,0,.6)'; ctx.fill();
  const hp = clamp(t.shownHp / 100, 0, 1);
  rr(t.x - 17, t.y - 34, 34 * hp, 4, 2); ctx.fillStyle = hp > .5 ? '#4ade80' : hp > .25 ? '#facc15' : '#ef4444'; ctx.fill();
  if (active) {
    const b = Math.sin(T * .12) * 3;
    ctx.save(); glow(t.color, 12); ctx.fillStyle = t.color;
    ctx.beginPath(); ctx.moveTo(t.x, t.y - 55 + b); ctx.lineTo(t.x - 8, t.y - 67 + b); ctx.lineTo(t.x + 8, t.y - 67 + b); ctx.closePath(); ctx.fill();
    ctx.restore();
  }
}

function drawAimHelpers(t) {
  const p = pivot(t), a = t.angle * Math.PI / 180;
  ctx.save();
  ctx.strokeStyle = 'rgba(255,255,255,.28)'; ctx.lineWidth = 1;
  ctx.beginPath(); ctx.arc(p.x, p.y, 46, Math.PI, TAU); ctx.stroke();
  for (let d = 0; d <= 180; d += 15) {
    const r = d % 45 === 0 ? 7 : 4, c = Math.cos(d * Math.PI / 180), s = Math.sin(d * Math.PI / 180);
    ctx.beginPath(); ctx.moveTo(p.x + c * 46, p.y - s * 46); ctx.lineTo(p.x + c * (46 + r), p.y - s * (46 + r)); ctx.stroke();
  }
  const len = 34 + t.power * .75;
  ctx.setLineDash([6, 6]); ctx.lineDashOffset = -T * .5; ctx.strokeStyle = t.color; ctx.lineWidth = 2; ctx.globalAlpha = .8;
  ctx.beginPath(); ctx.moveTo(p.x + Math.cos(a) * 30, p.y - Math.sin(a) * 30); ctx.lineTo(p.x + Math.cos(a) * len, p.y - Math.sin(a) * len); ctx.stroke();
  ctx.restore();
  if (assist && !t.ai) {
    const pts = previewPoints(t);
    pts.forEach(([x, y], i) => { ctx.globalAlpha = 1 - i / pts.length * .85; ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(x, y, 2.2, 0, TAU); ctx.fill(); });
    ctx.globalAlpha = 1;
  }
}

function drawShots() {
  for (const s of shots) {
    const c = s.w.color || '#fff';
    ctx.lineCap = 'round';
    for (let i = 1; i < s.trail.length; i++) {
      ctx.globalAlpha = i / s.trail.length * .7; ctx.strokeStyle = c; ctx.lineWidth = 1 + i / s.trail.length * 3;
      ctx.beginPath(); ctx.moveTo(s.trail[i - 1][0], s.trail[i - 1][1]); ctx.lineTo(s.trail[i][0], s.trail[i][1]); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.save(); glow(c, 16); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(s.x, s.y, s.w.radius > 50 ? 5 : 3.4, 0, TAU); ctx.fill(); ctx.restore();
  }
}

function drawParts() {
  for (const p of parts) {
    const t = p.life / p.max;
    if (p.type === 'fire') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = Math.min(1, t * 1.4);
      ctx.fillStyle = `hsl(${12 + t * 42},100%,${40 + t * 22}%)`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (.35 + t), 0, TAU); ctx.fill();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'smoke') {
      ctx.globalAlpha = t * .4; ctx.fillStyle = '#5b5d68';
      ctx.beginPath(); ctx.arc(p.x, p.y, p.size * (1 + (1 - t) * 1.8), 0, TAU); ctx.fill();
    } else if (p.type === 'spark') {
      ctx.globalCompositeOperation = 'lighter'; ctx.globalAlpha = t; ctx.strokeStyle = '#ffd27a'; ctx.lineWidth = p.size;
      ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 2.2, p.y - p.vy * 2.2); ctx.stroke();
      ctx.globalCompositeOperation = 'source-over';
    } else if (p.type === 'dirt') {
      ctx.globalAlpha = Math.min(1, t * 3); ctx.fillStyle = p.color; ctx.fillRect(p.x, p.y, p.size, p.size);
    } else if (p.type === 'confetti') {
      ctx.globalAlpha = Math.min(1, t * 2); ctx.fillStyle = p.color;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, Math.abs(Math.sin(p.rot * 1.7)) + .2);
      ctx.fillRect(-p.size / 2, -p.size / 4, p.size, p.size / 2); ctx.restore();
    }
  }
  ctx.globalAlpha = 1;
  for (const r of rings) {
    const t = r.life / r.max;
    ctx.globalAlpha = t; ctx.strokeStyle = r.color; ctx.lineWidth = r.w * t + .5;
    ctx.beginPath(); ctx.arc(r.x, r.y, lerp(r.r1, r.r0, t), 0, TAU); ctx.stroke();
  }
  for (const f of flashes) {
    const t = f.life / f.max, g = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, f.r);
    g.addColorStop(0, `rgba(255,250,220,${t})`); g.addColorStop(.4, `rgba(255,170,60,${t * .55})`); g.addColorStop(1, 'rgba(255,100,0,0)');
    ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = g; ctx.fillRect(f.x - f.r, f.y - f.r, f.r * 2, f.r * 2);
    ctx.globalCompositeOperation = 'source-over';
  }
  ctx.globalAlpha = 1;
  for (const p of popups) {
    const t = p.life / p.max;
    ctx.globalAlpha = Math.min(1, t * 2.2);
    text(p.s, p.x, p.y, p.size * (1 + (1 - t) * .15), p.color, 'center', '900', 'rgba(0,0,0,.75)');
  }
  ctx.globalAlpha = 1;
}

function drawWorld(actors) {
  ctx.save();
  if (shake) ctx.translate(rnd(-shake, shake), rnd(-shake, shake));
  drawBackdrop(); drawWindStreaks(); drawTerrain();
  for (const t of actors) if (t.hp <= 0) drawTank(t, false);
  for (const t of actors) if (t.hp > 0) drawTank(t, mode === 'play' && state === 'aim' && t.i === turn);
  if (mode === 'play' && state === 'aim' && !paused) drawAimHelpers(tanks[turn]);
  drawShots(); drawParts();
  ctx.restore();
  if (whiteFlash > .02) { ctx.fillStyle = `rgba(255,255,255,${whiteFlash})`; ctx.fillRect(0, 0, W, H); }
}

// ====================================================== drawing: HUD
function drawCards() {
  const n = tanks.length, cw = 250, gap = 12, x0 = (W - (cw * n + gap * (n - 1))) / 2, y = 12, h = 62;

    ctx.strokeStyle = 'rgba(0,0,0,.4)'; ctx.lineWidth = 2; ctx.stroke();
    text(t.hp <= 0 ? '☠' : 'P' + (i + 1), x + 26, y + 32, t.hp <= 0 ? 18 : 15, '#0b0d14', 'center', '900');
    text('PLAYER ' + (i + 1), x + 52, y + 17, 13, '#fff', 'left', '800');
    text(t.ai ? 'CPU' : 'HUMAN', x + cw - 12, y + 17, 11, 'rgba(255,255,255,.5)', 'right', '700');
    // hp
    rr(x + 52, y + 29, cw - 104, 12, 6); ctx.fillStyle = 'rgba(0,0,0,.55)'; ctx.fill();
    const hp = clamp(t.shownHp / 100, 0, 1);
    if (hp > .01) {

      const base = hp > .5 ? '#4ade80' : hp > .25 ? '#facc15' : '#ef4444';
      g.addColorStop(0, shade(base, .35)); g.addColorStop(1, shade(base, -.15));
      rr(x + 52, y + 29, (cw - 104) * hp, 12, 6); ctx.fillStyle = g; ctx.fill();
    }
    text(String(Math.max(0, Math.round(t.hp))), x + cw - 46, y + 36, 14, '#fff', 'left', '800');
    text('★'.repeat(Math.min(wins[i], 6)) + (wins[i] > 6 ? ' ×' + wins[i] : '') || '', x + 52, y + 51, 12, '#fcd34d', 'left', '700');
    if (!wins[i]) text('no wins yet', x + 52, y + 51, 10.5, 'rgba(255,255,255,.35)', 'left', '600');
    if (t.special) {
      const pulse = 1 + Math.sin(T * .15) * .08;
      ctx.save(); glow(t.special.color, 14); ctx.fillStyle = t.special.color + '55';
      ctx.beginPath(); ctx.arc(x + cw - 24, y + 47, 12 * pulse, 0, TAU); ctx.fill(); noGlow(); ctx.restore();
      text(t.special.icon, x + cw - 24, y + 48, 15, '#fff', 'center');
    }
    ctx.restore();
  });
}

function drawWind() {
  const cx = W / 2, y = 94, w = 230, h = 24;
  panel(cx - w / 2, y - h / 2, w, h, 12);
  text('WIND', cx - w / 2 + 14, y + 1, 11, 'rgba(255,255,255,.6)', 'left', '800');
  const mid = cx + 12, half = 62, f = wind / 10;
  rr(mid - half, y - 4, half * 2, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
  ctx.fillStyle = '#93c5fd';
  if (wind) { rr(f > 0 ? mid : mid + f * half, y - 4, Math.abs(f) * half, 8, 4); ctx.fill(); }
  ctx.fillStyle = 'rgba(255,255,255,.5)'; ctx.fillRect(mid - 1, y - 7, 2, 14);
  text(wind === 0 ? 'calm' : (wind < 0 ? '◀ ' : '') + Math.abs(wind) + (wind > 0 ? ' ▶' : ''), cx + w / 2 - 12, y + 1, 12, '#fff', 'right', '800');
}

function drawControlPanel() {
  const t = tanks[turn], x = 90, w = W - 180, y0 = H - 100, h = 84, col = t.color;
  ctx.save(); glow(col, 14); panel(x, y0, w, h, 16, col, 2); noGlow(); ctx.restore();
  // angle gauge
  const gx = 152, gy = y0 + 70, gr = 52;
  ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(255,255,255,.1)'; ctx.beginPath(); ctx.arc(gx, gy, gr - 6, Math.PI, TAU); ctx.stroke();
  const a = t.angle * Math.PI / 180;
  ctx.lineWidth = 1; ctx.strokeStyle = 'rgba(255,255,255,.35)';
  for (let d = 0; d <= 180; d += 30) { const c = Math.cos(d * Math.PI / 180), s = Math.sin(d * Math.PI / 180); ctx.beginPath(); ctx.moveTo(gx + c * (gr - 2), gy - s * (gr - 2)); ctx.lineTo(gx + c * (gr + 3), gy - s * (gr + 3)); ctx.stroke(); }
  ctx.save(); glow(col, 8); ctx.strokeStyle = col; ctx.lineWidth = 3; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(gx, gy); ctx.lineTo(gx + Math.cos(a) * (gr - 4), gy - Math.sin(a) * (gr - 4)); ctx.stroke(); ctx.restore();
  ctx.fillStyle = col; ctx.beginPath(); ctx.arc(gx, gy, 4, 0, TAU); ctx.fill();
  text(Math.round(t.angle) + '°', gx, gy - 20, 18, '#fff', 'center', '800');
  text('ANGLE', gx, y0 + 12, 10, 'rgba(255,255,255,.55)', 'center', '800');
  // power
  const px = 240, pw = 310;
  text('POWER', px, y0 + 16, 11, 'rgba(255,255,255,.55)', 'left', '800');
  text(String(Math.round(t.power)), px + pw, y0 + 16, 18, '#fff', 'right', '800');
  const segs = 28, sw = (pw - (segs - 1) * 2) / segs, lit = Math.round(t.power / 100 * segs);
  for (let i = 0; i < segs; i++) {
    const f = i / (segs - 1), c = f < .5 ? '#4ade80' : f < .8 ? '#facc15' : '#ef4444';
    ctx.fillStyle = i < lit ? c : 'rgba(255,255,255,.09)'; rr(px + i * (sw + 2), y0 + 28, sw, 20, 2.5); ctx.fill();
  }
  text('FUEL', px, y0 + 62, 10, 'rgba(255,255,255,.55)', 'left', '800');
  rr(px + 40, y0 + 58, pw - 40, 8, 4); ctx.fillStyle = 'rgba(255,255,255,.1)'; ctx.fill();
  if (t.fuel > 0) { rr(px + 40, y0 + 58, (pw - 40) * t.fuel / 60, 8, 4); ctx.fillStyle = '#38bdf8'; ctx.fill(); }
  // weapons
  const sx = 572, sy = y0 + 12, sw2 = 80, sh = 60;
  WEAPONS.forEach((wp, i) => {
    const x2 = sx + i * 86, sel = t.weapon === i && !t.special, empty = t.ammo[i] <= 0;
    ctx.save(); if (sel) glow(wp.color, 12);
    rr(x2, sy, sw2, sh, 10); ctx.fillStyle = sel ? 'rgba(255,255,255,.14)' : 'rgba(255,255,255,.05)'; ctx.fill();
    ctx.strokeStyle = sel ? wp.color : 'rgba(255,255,255,.14)'; ctx.lineWidth = sel ? 2 : 1; ctx.stroke(); ctx.restore();
    ctx.globalAlpha = empty ? .3 : t.special ? .55 : 1;
    text(wp.icon, x2 + sw2 / 2, sy + 24, 22, '#fff', 'center');
    text(wp.name, x2 + sw2 / 2, sy + 46, 11, '#fff', 'center', '700');
    text('[' + (i + 1) + ']', x2 + 8, sy + 10, 10, 'rgba(255,255,255,.6)', 'left', '700');
    text(wp.ammo === Infinity ? '∞' : '×' + t.ammo[i], x2 + sw2 - 8, sy + 10, 11, '#fff', 'right', '800');
    ctx.globalAlpha = 1;
  });
  const x3 = sx + 262, sp = t.special;
  ctx.save(); if (sp) glow(sp.color, 14 + Math.sin(T * .15) * 5);
  rr(x3, sy, 96, sh, 10); ctx.fillStyle = sp ? sp.color + '33' : 'rgba(255,255,255,.03)'; ctx.fill();
  ctx.strokeStyle = sp ? sp.color : 'rgba(255,255,255,.12)'; ctx.lineWidth = sp ? 2 : 1; ctx.setLineDash(sp ? [] : [4, 4]); ctx.stroke(); ctx.restore();
  if (sp) { text(sp.icon, x3 + 48, sy + 24, 22, '#fff', 'center'); text(sp.name, x3 + 48, sy + 46, 11, '#fff', 'center', '800'); text('PRIZE', x3 + 8, sy + 10, 9, sp.color, 'left', '800'); }
  else { text('PRIZE', x3 + 48, sy + 22, 11, 'rgba(255,255,255,.3)', 'center', '800'); text('hit to spin', x3 + 48, sy + 42, 10, 'rgba(255,255,255,.3)', 'center'); }
  // fire button
  const fx = x + w - 92, ready = state === 'aim' && !t.ai, p = ready ? 1 + Math.sin(T * .12) * .03 : 1;
  ctx.save(); ctx.translate(fx + 40, sy + 30); ctx.scale(p, p);
  if (ready) glow(col, 14);
  rr(-40, -30, 80, 60, 12); ctx.fillStyle = ready ? col : 'rgba(255,255,255,.08)'; ctx.fill(); noGlow();
  text(t.ai ? 'CPU' : 'FIRE', 0, -6, 17, ready ? '#0b0d14' : 'rgba(255,255,255,.45)', 'center', '900');
  text(t.ai ? (state === 'aim' ? 'thinking…' : '') : 'SPACE', 0, 14, 10, ready ? 'rgba(0,0,0,.6)' : 'rgba(255,255,255,.4)', 'center', '800');
  ctx.restore();
  // hint ribbon
  text(`A/D move  ·  ←→ angle  ·  ↑↓ power (Shift = fine)  ·  1-3 weapon  ·  T aim assist: ${assist ? 'ON' : 'OFF'}  ·  M sound: ${muted ? 'OFF' : 'ON'}  ·  P pause  ·  Esc menu`,
       W / 2, H - 7, 11, 'rgba(255,255,255,.55)', 'center', '600', 'rgba(0,0,0,.6)');
}

function drawBanner() {
  if (!banner || state === 'over') return;
  const t = banner.t, a = t < 14 ? t / 14 : t > 90 ? 1 - (t - 90) / 20 : 1, off = (1 - Math.min(1, t / 14)) * -140;
  ctx.save(); ctx.globalAlpha = Math.max(0, a); ctx.translate(off, 0);
  glow(banner.color, 20); panel(W / 2 - 170, 134, 340, 52, 26, banner.color, 2); noGlow();
  text(banner.text, W / 2, 154, 22, '#fff', 'center', '900');
  text(banner.sub, W / 2, 174, 11, banner.color, 'center', '800');
  ctx.restore();
}

function drawWheel() {
  const n = SPECIALS.length, step = TAU / n, cx = W / 2, cy = H / 2 + 14, r = 168;
  const R = wheelAngle(wheel.t), t = tanks[turn], done = wheel.t >= wheel.spin;
  ctx.fillStyle = 'rgba(4,6,14,.92)'; ctx.fillRect(0, 0, W, H);
  // rotating rays
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(T * .004);
  for (let i = 0; i < 18; i++) { ctx.rotate(TAU / 18); ctx.fillStyle = 'rgba(255,255,255,.035)'; ctx.beginPath(); ctx.moveTo(0, 0); ctx.arc(0, 0, 720, 0, TAU / 36); ctx.closePath(); ctx.fill(); }
  ctx.restore();
  text(`PLAYER ${turn + 1} SCORED A HIT!`, cx, 52, 34, t.color, 'center', '900', 'rgba(0,0,0,.6)');
  text(done ? 'PRIZE WON' : 'SPINNING FOR A PRIZE…', cx, 88, 15, 'rgba(255,255,255,.7)', 'center', '800');
  // outer ring
  ctx.save(); glow(done ? SPECIALS[wheel.idx].color : '#facc15', 26);
  ctx.beginPath(); ctx.arc(cx, cy, r + 20, 0, TAU); ctx.fillStyle = '#1b1f33'; ctx.fill(); noGlow();
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 4; ctx.stroke(); ctx.restore();
  for (let i = 0; i < 28; i++) {
    const a = i / 28 * TAU, on = done ? (Math.floor(T / 6) % 2 === i % 2) : ((i + Math.floor(T / 3)) % 3 === 0);
    ctx.fillStyle = on ? '#fff7b0' : '#8a7a2a'; if (on) glow('#ffe66d', 10);
    ctx.beginPath(); ctx.arc(cx + Math.cos(a) * (r + 11), cy + Math.sin(a) * (r + 11), 4, 0, TAU); ctx.fill(); noGlow();
  }
  // slices
  for (let i = 0; i < n; i++) {
    const a0 = R + i * step - Math.PI / 2, sp = SPECIALS[i], win = done && i === wheel.idx;
    const g = ctx.createRadialGradient(cx, cy, 10, cx, cy, r);
    g.addColorStop(0, shade(sp.color, .3)); g.addColorStop(1, shade(sp.color, -.2));
    ctx.fillStyle = g; ctx.beginPath(); ctx.moveTo(cx, cy); ctx.arc(cx, cy, r, a0, a0 + step); ctx.closePath(); ctx.fill();
    if (win && Math.floor(T / 8) % 2) { ctx.fillStyle = 'rgba(255,255,255,.28)'; ctx.fill(); }
    ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = 2; ctx.stroke();
    ctx.save(); ctx.translate(cx, cy); ctx.rotate(a0 + step / 2);
    text(sp.name, r - 14, 0, 14, '#fff', 'right', '900', 'rgba(0,0,0,.45)');
    ctx.save(); ctx.translate(r - 112, 0); ctx.rotate(Math.PI / 2); text(sp.icon, 0, 0, 28, '#fff', 'center'); ctx.restore();
    ctx.restore();
  }
  ctx.fillStyle = '#1b1f33'; ctx.beginPath(); ctx.arc(cx, cy, 24, 0, TAU); ctx.fill();
  ctx.strokeStyle = '#facc15'; ctx.lineWidth = 3; ctx.stroke();
  text('★', cx, cy + 1, 22, '#facc15', 'center', '900');
  // pointer
  ctx.save(); ctx.translate(cx, cy - r - 24); ctx.rotate(wheel.flick * .35);
  glow('#000', 8); ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.moveTo(0, 38); ctx.lineTo(-15, 4); ctx.lineTo(15, 4); ctx.closePath(); ctx.fill();
  noGlow(); ctx.strokeStyle = '#fff'; ctx.lineWidth = 2.5; ctx.stroke(); ctx.restore();
  if (done) {
    const sp = SPECIALS[wheel.idx], k = Math.min(1, (wheel.t - wheel.spin) / 14), y = H - 72;
    ctx.save(); ctx.translate(cx, y); ctx.scale(.7 + .3 * k, .7 + .3 * k); ctx.globalAlpha = k;
    glow(sp.color, 22); panel(-250, -34, 500, 68, 20, sp.color, 3); noGlow();
    text(sp.icon, -212, 2, 34, '#fff', 'center');
    text(sp.name, -178, -10, 24, '#fff', 'left', '900');
    text(sp.desc + ' — loaded for your next shot', -178, 16, 13, 'rgba(255,255,255,.75)', 'left', '600');
    ctx.restore();
  }
  drawParts();
}

function drawOver() {
  ctx.fillStyle = 'rgba(4,6,14,.6)'; ctx.fillRect(0, 0, W, H);
  const col = winner >= 0 ? COLORS[winner] : '#fff';
  ctx.save(); glow(col, 28); panel(W / 2 - 300, 150, 600, 200, 24, col, 3); noGlow(); ctx.restore();
  text(winner >= 0 ? '🏆' : '🤝', W / 2, 200, 44, '#fff', 'center');
  text(winner >= 0 ? `PLAYER ${winner + 1} WINS!` : 'DRAW!', W / 2, 262, 50, col, 'center', '900', 'rgba(0,0,0,.6)');
  const n = tanks.length, sw = 120, x0 = W / 2 - (n * sw) / 2;
  tanks.forEach((t, i) => {
    const x = x0 + i * sw + sw / 2;
    ctx.fillStyle = t.color; ctx.beginPath(); ctx.arc(x - 24, 316, 11, 0, TAU); ctx.fill();
    text(`P${i + 1}`, x - 24, 317, 11, '#0b0d14', 'center', '900');
    text('★ ' + wins[i], x + 4, 317, 17, '#fcd34d', 'left', '800');
  });
  text('ENTER  next round     ·     ESC  main menu', W / 2, 395, 16, '#fff', 'center', '700', 'rgba(0,0,0,.6)');
  drawParts();
}

// ====================================================== drawing: menu
function button(x, y, w, h, big, sub, key, color, action) {
  const hov = mouse.x >= x && mouse.x <= x + w && mouse.y >= y && mouse.y <= y + h;
  menuButtons.push({x, y, w, h, action});
  ctx.save(); if (hov) glow(color, 24);
  rr(x, y, w, h, 16);
  const g = ctx.createLinearGradient(0, y, 0, y + h);
  g.addColorStop(0, hov ? 'rgba(255,255,255,.28)' : 'rgba(255,255,255,.14)'); g.addColorStop(1, hov ? 'rgba(255,255,255,.1)' : 'rgba(10,12,24,.55)');
  ctx.fillStyle = g; ctx.fill(); ctx.strokeStyle = hov ? color : 'rgba(255,255,255,.3)'; ctx.lineWidth = 2.2; ctx.stroke(); ctx.restore();
  text(big, x + w / 2, y + h * .42, 40, '#fff', 'center', '900', 'rgba(0,0,0,.35)');
  text(sub, x + w / 2, y + h * .76, 13, 'rgba(255,255,255,.8)', 'center', '700');
  if (key) text('[' + key + ']', x + 12, y + 14, 11, 'rgba(255,255,255,.6)', 'left', '800');
  return hov;
}

function pickCount(n) { numPlayers = n; menuStage = 'humans'; sfx.click(); }
function pickHumans(n) { numHumans = n; wins = [0, 0, 0, 0]; sfx.click(); startRound(); }

function drawMenu() {
  menuButtons = [];
  ctx.fillStyle = 'rgba(5,8,20,.32)'; ctx.fillRect(0, 0, W, H);
  // title
  try { ctx.letterSpacing = '6px'; } catch (e) {}
  ctx.font = '900 70px "Segoe UI", system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  const tg = ctx.createLinearGradient(0, 55, 0, 125); tg.addColorStop(0, '#fff3b0'); tg.addColorStop(.5, '#ffb347'); tg.addColorStop(1, '#ef4444');
  ctx.lineWidth = 12; ctx.strokeStyle = 'rgba(30,8,8,.9)'; ctx.lineJoin = 'round'; ctx.strokeText('SCORCHED TANKS', W / 2, 92);
  ctx.save(); glow('rgba(255,120,40,.7)', 30); ctx.fillStyle = tg; ctx.fillText('SCORCHED TANKS', W / 2, 92); ctx.restore();
  try { ctx.letterSpacing = '0px'; } catch (e) {}
  text('ARTILLERY  ·  DESTRUCTIBLE TERRAIN  ·  PRIZE WHEEL  ·  2–4 PLAYERS', W / 2, 142, 14, 'rgba(255,255,255,.85)', 'center', '800', 'rgba(0,0,0,.5)');

  let any = false;
  if (menuStage === 'count') {
    text('CHOOSE BATTLE SIZE', W / 2, 198, 16, '#fff', 'center', '800', 'rgba(0,0,0,.5)');
    [2, 3, 4].forEach((n, i) => { if (button(W / 2 - 300 + i * 205, 218, 190, 96, n + '', n + ' TANKS', n, COLORS[i + 1], () => pickCount(n))) any = true; });
  } else {
    text(`${numPlayers} TANKS — HOW MANY HUMANS?`, W / 2, 198, 16, '#fff', 'center', '800', 'rgba(0,0,0,.5)');
    const opts = Array.from({length: numPlayers + 1}, (_, i) => i), bw = 150, gap = 14, x0 = W / 2 - (opts.length * bw + (opts.length - 1) * gap) / 2;
    opts.forEach((n, i) => {
      const sub = n === 0 ? 'WATCH CPUs' : n === numPlayers ? 'ALL HUMAN' : (numPlayers - n) + ' CPU';
      if (button(x0 + i * (bw + gap), 218, bw, 96, n + '', sub, n, COLORS[i % 4], () => pickHumans(n))) any = true;
    });
    if (button(W / 2 - 60, 326, 120, 34, '◀', '', 'Esc', '#fff', () => { menuStage = 'count'; sfx.click(); })) any = true;
  }
  cv.style.cursor = any ? 'pointer' : 'default';

  // info panels
  panel(60, 392, 470, 200, 16);
  text('HOW TO PLAY', 84, 416, 14, '#facc15', 'left', '900');
  [['←  →', 'aim the barrel'], ['↑  ↓', 'set power  (hold Shift for fine)'], ['A  D', 'drive (limited fuel)'], ['1  2  3', 'pick weapon'], ['SPACE', 'fire!'], ['T / M / P', 'aim assist / sound / pause']]
    .forEach(([k, d], i) => { const y = 444 + i * 24; rr(84, y - 10, 82, 20, 6); ctx.fillStyle = 'rgba(255,255,255,.14)'; ctx.fill(); text(k, 125, y + 1, 12, '#fff', 'center', '800'); text(d, 180, y + 1, 13, 'rgba(255,255,255,.85)', 'left', '600'); });
  panel(550, 392, 510, 200, 16);
  text('HIT AN ENEMY → SPIN THE PRIZE WHEEL', 574, 416, 14, '#facc15', 'left', '900');
  SPECIALS.forEach((s, i) => {
    const x = 574 + (i % 2) * 245, y = 447 + Math.floor(i / 2) * 40;
    rr(x, y - 17, 235, 34, 10); ctx.fillStyle = s.color + '33'; ctx.fill(); ctx.strokeStyle = s.color + 'aa'; ctx.lineWidth = 1.5; ctx.stroke();
    text(s.icon, x + 22, y + 1, 20, '#fff', 'center'); text(s.name, x + 42, y - 6, 12, '#fff', 'left', '900'); text(s.desc, x + 42, y + 9, 10.5, 'rgba(255,255,255,.7)', 'left', '600');
  });
  drawParts();
}

// ====================================================== main draw/loop
function draw() {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  if (mode === 'menu') { drawWorld(menuTanks); drawMenu(); return; }
  drawWorld(tanks);
  drawCards(); drawWind(); drawControlPanel(); drawBanner();
  if (state === 'wheel' && wheel) drawWheel();
  if (state === 'over') drawOver();
  if (paused) {
    ctx.fillStyle = 'rgba(4,6,14,.6)'; ctx.fillRect(0, 0, W, H);
    text('PAUSED', W / 2, H / 2 - 10, 60, '#fff', 'center', '900', 'rgba(0,0,0,.6)');
    text('press P to resume', W / 2, H / 2 + 40, 16, 'rgba(255,255,255,.7)', 'center', '700');
  }
  cv.style.cursor = 'default';
}

function initMenuScene() {
  numPlayers = 4; makeScene();
  menuTanks = [0, 1, 2, 3].map(i => { const t = newTank(i); t.x = 130 + i * 285 + rnd(-30, 30); t.y = ground[Math.floor(t.x)] - 4; t.tilt = tiltAt(t.x); return t; });
  numPlayers = 2;
}

// ====================================================== input
addEventListener('keydown', e => {
  const k = e.key.toLowerCase();
  keys[k] = true; audio();
  if (['arrowleft', 'arrowright', 'arrowup', 'arrowdown', ' '].includes(k)) e.preventDefault();
  if (k === 'm') { muted = !muted; return; }
  if (mode === 'menu') {
    const n = parseInt(e.key);
    if (menuStage === 'count') { if (n >= 2 && n <= 4) pickCount(n); }
    else if (k === 'escape' || k === 'backspace') { menuStage = 'count'; }
    else if (n >= 0 && n <= numPlayers) pickHumans(n);
    return;
  }
  if (k === 'escape') { mode = 'menu'; menuStage = 'count'; initMenuScene(); return; }
  if (k === 'p' && state !== 'over') { paused = !paused; return; }
  if (k === 't') { assist = !assist; return; }
  if (state === 'over' && k === 'enter') { startRound(); return; }
  if (paused) return;
  if (state === 'aim' && !tanks[turn].ai) {
    if (k === ' ' && !e.repeat) fire();
    const n = '123'.indexOf(k);
    if (n >= 0 && k.length === 1 && tanks[turn].ammo[n] > 0) { tanks[turn].weapon = n; sfx.click(); }
  }
});
addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });
function toCanvas(e) { const r = cv.getBoundingClientRect(); return {x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height}; }
cv.addEventListener('mousemove', e => Object.assign(mouse, toCanvas(e)));
cv.addEventListener('mouseleave', () => { mouse.x = mouse.y = -1; });
cv.addEventListener('mousedown', e => {
  audio(); Object.assign(mouse, toCanvas(e));
  if (mode !== 'menu') return;
  for (const b of menuButtons) if (mouse.x >= b.x && mouse.x <= b.x + b.w && mouse.y >= b.y && mouse.y <= b.y + b.h) { b.action(); break; }
});

initMenuScene();
(function loop() { update(); draw(); requestAnimationFrame(loop); })();
</script>
